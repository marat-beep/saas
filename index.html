<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3DMP Service</title>
<script>
  /* Без завершающего слэша относительные пути ломаются: /saas -> /saas/ */
  (function () {
    var p = location.pathname;
    if (p.charAt(p.length - 1) !== '/' && !/\.html?$/i.test(p)) {
      location.replace(p + '/' + location.search + location.hash);
    }
  })();
</script>
<link rel="stylesheet" href="assets/css/app.css?v=2">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">⚙️</span> <a href="index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="account">…</span>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Рабочий сервис 3DMP</h1>
      <p>Статический фронтенд + Supabase: данные, авторизация и права — в облаке. Публикация — на <b>sapfir.eu/saas</b>.</p>
    </section>

    <section class="card">
      <h2>Подключение</h2>
      <div class="status" id="conn"><span class="dot wait"></span><span class="status-text">Проверка…</span></div>
      <ul class="checklist" data-checklist></ul>
    </section>

    <section class="card">
      <h2>Приложения</h2>
      <div class="apps-grid" id="apps"></div>
    </section>
  </main>

  <footer class="foot">3DMP Service · Supabase · <span id="ver"></span></footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="assets/js/config.js?v=1"></script>
  <script src="assets/js/supabase-client.js?v=1"></script>
  <script src="assets/js/ui.js?v=1"></script>
  <script src="assets/js/status.js?v=1"></script>
  <script src="assets/js/auth.js?v=3"></script>
  <script src="assets/js/catalog.js?v=15"></script>
  <script>
    (function () {
      'use strict';
      var C = window.AppCatalog;
      var ui = window.AppUI;

      document.getElementById('ver').textContent = 'v' + C.version;

      function renderApps(user) {
        var logged = !!user;
        var list = C.apps.filter(function (a) {
          if (!a.roles) return true;
          return logged && a.roles.indexOf(user.role) >= 0;
        });
        document.getElementById('apps').innerHTML = list.map(function (a) {
          var needAuth = !a.guest && !logged;
          var href = needAuth ? 'apps/auth/index.html' : a.href;
          var tag = a.guest ? 'открыто' : (logged ? 'личный' : 'нужен вход');
          return '<a class="app-card" href="' + href + '">' +
            '<span class="ic">' + a.icon + '</span>' +
            '<h3>' + ui.esc(a.title) + '</h3>' +
            '<p>' + ui.esc(a.desc) + '</p>' +
            '<span class="tag">' + tag + '</span></a>';
        }).join('');
      }

      function renderAccount(s) {
        var el = document.getElementById('account');
        if (s) {
          el.innerHTML = '<span class="who">' + ui.esc(s.login || '') +
            (s.role ? ' · ' + ui.esc(s.role) : '') + '</span> ' +
            '<button class="tbtn" id="logout">Выйти</button>';
          document.getElementById('logout').addEventListener('click', function () {
            window.Auth.logout(); location.reload();
          });
        } else {
          el.innerHTML = '<a class="tbtn" href="apps/auth/index.html">Войти</a>';
        }
      }

      function refreshUI() {
        var s = window.Auth.session();
        renderAccount(s);
        renderApps(s);
      }

      window.AppStatus.render('#conn').then(function () {
        refreshUI();
        if (window.Auth.isLogged()) window.Auth.refresh().then(refreshUI);
      });
    })();
  </script>
  <script src="assets/js/realtime.js?v=1"></script>
  <script src="assets/js/nav.js?v=14"></script>
  <script src="assets/js/notify.js?v=1"></script>
</body>
</html>
