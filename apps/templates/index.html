<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаблоны документов — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=15">
<style>
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;font:inherit;font-size:.85rem}
  @media(max-width:680px){.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">📝</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <div class="hero"><h1>Шаблоны документов</h1><p>КП/договор/акт/техкарта с подстановками; создание документа из шаблона. Прототип B33.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <h2>Новый/редактируемый шаблон</h2>
      <div class="msg" id="fMsg"></div>
      <div class="grid3">
        <div class="field"><label>Тип</label><select id="fType"><option value="kp">КП</option><option value="contract">Договор</option><option value="act">Акт</option><option value="techcard">Техкарта</option><option value="other">Другое</option></select></div>
        <div class="field"><label>Название *</label><input type="text" id="fName" placeholder="Коммерческое предложение"></div>
        <div class="field" style="display:flex;align-items:flex-end;"><button class="btn" id="fSave">Сохранить шаблон</button></div>
      </div>
      <div class="field"><label>Текст (подстановки: {customer}, {order}, {title}, {amount}, {date})</label><textarea id="fBody" rows="5"></textarea></div>
      <button class="btn secondary mt" id="fClear">Очистить</button>
    </div>

    <div class="card">
      <div class="toolbar">
        <select id="fOrder" style="padding:9px;border:1px solid var(--border);border-radius:9px;"><option value="">— заявка для создания —</option></select>
        <input type="search" class="search" id="q" placeholder="Поиск шаблона…">
      </div>
      <h2>Шаблоны <span class="note" id="cnt"></span></h2>
      <div class="olist mt" id="list"><span class="note">Загрузка…</span></div>
      <div class="msg" id="mMsg"></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · шаблоны документов</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=1"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=2"></script>
  <script src="../../assets/js/auth.js?v=5"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=49"></script>
  <script src="templates.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
