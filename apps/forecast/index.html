<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Прогноз загрузки — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=15">
<style>
  table.mini{width:100%;border-collapse:collapse;font-size:.84rem}
  table.mini th,table.mini td{border-bottom:1px solid #eef2f7;padding:7px 9px;text-align:left}
  table.mini th{color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:10px;border-radius:6px;background:#eef2f7;overflow:hidden;min-width:80px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .bar i.warn{background:#f59e0b}.bar i.over{background:#dc2626}
  .risk-просрочен{color:#b91c1c;font-weight:700}.risk-риск{color:#b45309;font-weight:700}.risk-норма{color:#047857}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">📈</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <div class="hero"><h1>Прогноз загрузки (B39 · Сессия F)</h1><p>Загрузка по дням, ETA по нарядам/заказам и риск просрочки — по данным нарядов и слотов.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <div class="toolbar"><label class="note">Горизонт, дней:</label><input type="number" id="days" value="14" min="3" max="90" style="padding:9px;border:1px solid var(--border);border-radius:9px;width:100px;"><button class="btn secondary" id="refresh" style="width:auto;padding:8px 14px;">Обновить</button></div>
      <h2>Загрузка по дням</h2>
      <div class="msg" id="lMsg"></div>
      <div id="load" class="mt"><span class="note">Загрузка…</span></div>
    </div>

    <div class="card">
      <h2>Прогноз по нарядам <span class="note" id="cnt"></span></h2>
      <div id="orders" class="mt"><span class="note">Загрузка…</span></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · прогноз загрузки</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=1"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=2"></script>
  <script src="../../assets/js/auth.js?v=5"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=30"></script>
  <script src="forecast.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
