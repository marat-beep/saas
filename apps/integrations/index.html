<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интеграции — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=34">
<style>
  .int-card { border-left:4px solid var(--accent); }
  .int-card.off { border-left-color:#cbd5e1; opacity:.75; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🔌</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap fluid">
    <div class="hero"><h1>Интеграции</h1><p>Обмен с 1С/ERP (OData), e-mail (SMTP), Telegram/SMS, ЭДО. Настройка, очередь обмена, журнал и ретраи.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <div class="toolbar">
        <input type="search" class="search" id="q" placeholder="Поиск: название, тип, endpoint…">
        <button class="btn secondary" id="procBtn" style="width:auto;padding:10px 16px;">⟳ Обработать очередь</button>
        <button class="btn" id="newBtn" style="width:auto;padding:10px 16px;">＋ Интеграция</button>
      </div>
      <div class="msg" id="msg"></div>
      <div class="olist mt" id="list"><span class="note">Загрузка…</span></div>
    </div>

    <div class="card">
      <h2>Журнал обмена</h2>
      <div id="logList" style="overflow:auto;"><span class="note">Загрузка…</span></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · интеграции</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=4"></script>
  <script src="../../assets/js/auth.js?v=6"></script>
  <script src="../../assets/js/notify.js?v=3"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=74"></script>
  <script src="../../assets/js/shell.js?v=35"></script>
  <script src="integrations.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=2"></script>
  <script src="../../assets/js/module-info.js?v=1"></script>
</body>
</html>
