<!DOCTYPE html>

    <div class="brand"><span class="logo">⛑️</span> <a href="../../index.html">3DMP Service</a></div>

    <span class="who" id="who">…</span>

  <main class="wrap fluid">
    <div class="hero"><h1>Охрана труда (EHS)</h1><p>Инструктажи, наряды-допуски, СИЗ, медосмотры, инциденты. Роли: staff.</p></div>
    <div class="kpi-row" id="kpis"></div><div class="sv-actions" style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;"><button class="btn secondary" id="ehsScanBtn" style="padding:9px 14px;">⏱ Сроки EHS</button><span class="note" id="ehsMsg" style="align-self:center;"></span></div>

    <div class="toolbar mt"><input type="search" class="search" id="q" placeholder="Поиск по списку…" data-search="br,pm,ppe,med,inc"></div>
    <div class="tabs2" id="tabs">
      <button data-scr="br" class="active">Инструктажи</button>
      <button data-scr="pm">Допуски</button>
      <button data-scr="ppe">СИЗ</button>
      <button data-scr="med">Медосмотры</button>
      <button data-scr="inc">Инциденты</button>
    </div>
    <div class="msg" id="m"></div>

    <section class="screen active" id="scr-br"><div class="card"><div class="toolbar"><button class="btn" data-cap="edit" id="addBr">＋ Инструктаж</button></div><div id="br" class="mt"></div></div></section>
    <section class="screen" id="scr-pm"><div class="card"><div class="toolbar"><button class="btn" data-cap="edit" id="addPm">＋ Наряд-допуск</button></div><div id="pm" class="mt"></div></div></section>
    <section class="screen" id="scr-ppe"><div class="card"><div class="toolbar"><button class="btn" data-cap="edit" id="addPpe">＋ СИЗ</button></div><div id="ppe" class="mt"></div></div></section>
    <section class="screen" id="scr-med"><div class="card"><div class="toolbar"><button class="btn" data-cap="edit" id="addMed">＋ Медосмотр</button></div><div id="med" class="mt"></div></div></section>
    <section class="screen" id="scr-inc"><div class="card"><div class="toolbar"><button class="btn" data-cap="edit" id="addInc">＋ Инцидент</button></div><div id="inc" class="mt"></div></div></section>
  </main>

  <footer class="foot">3DMP Service · охрана труда</footer>
