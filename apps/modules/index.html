<!DOCTYPE html>

<style>
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .mcard{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:16px}
  .mcard .ic{font-size:1.4rem}

  .conn{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
  .conn a{font-size:.7rem;font-weight:600;text-decoration:none;color:var(--accent-700);background:var(--accent-100);border-radius:999px;padding:3px 9px}
  .io{font-size:.74rem;color:var(--muted);margin-top:8px}
  .act{display:inline-block;margin-top:12px;font-size:.8rem;font-weight:700;color:#fff;background:var(--accent);border-radius:9px;padding:8px 14px;text-decoration:none}
  .act:hover{background:var(--accent-700)}
  .roles{font-size:.68rem;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🧩</span> <a href="../../index.html">3DMP Service</a></div>
