<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сервис — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=16">
<style>
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:680px){.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🧑🔧</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <div class="hero"><h1>Сервис и ремонт</h1><p>Заявки на сервис/ремонт: заказчик, оборудование, дата, инженер, работы и стоимость. Прототип B29.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <h2>Новая заявка</h2>
      <div class="msg" id="fMsg"></div>
      <div class="grid3">
        <div class="field"><label>Заказчик</label><select id="fCust"><option value="">— нет —</option></select></div>
        <div class="field"><label>Оборудование</label><select id="fEq"><option value="">— нет —</option></select></div>
        <div class="field"><label>Тема *</label><input type="text" id="fTitle" placeholder="Пусконаладка штампа"></div>
      </div>
      <div class="grid3">
        <div class="field"><label>Вид</label><select id="fKind"><option value="service">Сервис</option><option value="repair">Ремонт</option><option value="warranty">Гарантия</option></select></div>
        <div class="field"><label>Дата</label><input type="date" id="fDate"></div>
        <div class="field"><label>Инженер</label><input type="text" id="fEng" placeholder="service"></div>
      </div>
      <div class="grid3">
        <div class="field"><label>Работы</label><input type="text" id="fWorks" placeholder="пробный прогон, подгонка"></div>
        <div class="field"><label>Стоимость, ₽</label><input type="text" id="fCost" inputmode="decimal" placeholder="25000"></div>
        <div class="field" style="display:flex;align-items:flex-end;"><button class="btn" id="fAdd">Создать заявку</button></div>
      </div>
    </div>

    <div class="card">
      <div class="toolbar"><input type="search" class="search" id="q" placeholder="Поиск: тема, заказчик, инженер…"></div>
      <h2>Заявки <span class="note" id="cnt"></span></h2>
      <div class="olist mt" id="list"><span class="note">Загрузка…</span></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · сервис</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=2"></script>
  <script src="../../assets/js/auth.js?v=5"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=51"></script>
  <script src="service.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
