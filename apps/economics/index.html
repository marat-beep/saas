<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Экономика — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=17">
<style>
  .tabs2{display:flex;gap:4px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:4px;margin:14px 0;width:fit-content}
  .tabs2 button{padding:8px 16px;border:none;background:transparent;border-radius:8px;font-weight:600;font-size:.82rem;color:var(--muted);cursor:pointer}
  .tabs2 button.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(15,23,42,.08)}
  .tab2{width:100%;border-collapse:collapse}
  .tab2 th,.tab2 td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);font-size:.83rem}
  .tab2 th{color:var(--muted);font-size:.72rem;text-transform:uppercase}
  .act{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:.74rem;font-weight:600;cursor:pointer}
  .act:hover{border-color:var(--accent);color:var(--accent-700)}
  .costrow td{background:#f8fafc;font-size:.78rem}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">💰</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <div class="hero"><h1>Экономика</h1><p>Себестоимость заявок по факту (работы + материалы + накладные), маржа, нормочас и загрузка центров.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="tabs2" id="tabs">
      <button class="active" data-t="ord">Себестоимость заявок</button>
      <button data-t="cap">Центры</button>
      <button data-t="rate">Ставки</button>
    </div>

    <section id="t-ord">
      <div class="card">
        <div id="ordersMsg"></div>
        <div style="overflow:auto;"><table class="tab2" id="orders"></table></div>
      </div>
    </section>

    <section id="t-cap" style="display:none;">
      <div class="card"><h2>Рабочие центры (нормочас и загрузка)</h2><div style="overflow:auto;"><table class="tab2" id="cap"></table></div></div>
    </section>

    <section id="t-rate" style="display:none;">
      <div class="card"><h2>Ставки и накладные</h2><div style="overflow:auto;"><table class="tab2" id="rates"></table></div></div>
    </section>
  </main>

  <footer class="foot">3DMP Service · экономика</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=2"></script>
  <script src="../../assets/js/auth.js?v=5"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=53"></script>
  <script src="economics.js?v=2"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
