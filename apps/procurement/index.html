<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Закупки — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=32">
<style>
  .bid { border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; }
  .bid.best { border-color:var(--accent); background:#f0fdf4; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🛒</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap fluid">
    <section class="screen active" id="s-list">
      <div class="hero"><h1>Закупки</h1><p>Потребность → публикация → КП поставщиков → выбор победителя. Связь с заявкой и поставщиками.</p></div>
      <div class="kpi-row" id="kpis"></div>
      <div class="card mt">
        <div class="toolbar">
          <input type="search" class="search" id="q" placeholder="Поиск: название, категория, материал, заявка…">
          <div class="chips" id="filters">
            <span class="chip active" data-f="">Все</span><span class="chip" data-f="open">Открытые</span>
            <span class="chip" data-f="awarded">С победителем</span><span class="chip" data-f="closed">Закрытые</span>
          </div>
          <button class="btn" id="toCreate" style="width:auto;padding:11px 18px;">＋ Новая закупка</button>
        </div>
        <div id="listMsg"></div>
        <div class="olist mt" id="list"><span class="note">Загрузка…</span></div>
      </div>
    </section>

    <section class="screen" id="s-create">
      <button class="back" id="back1">← К списку</button>
      <div class="card">
        <h2>Новая закупка</h2>
        <div class="msg" id="cMsg"></div>
        <div class="field"><label>Название *</label><input type="text" id="fTitle" placeholder="Закупка: сталь 40Х, круг Ø80"></div>
        <div class="field"><label>Описание</label><input type="text" id="fDesc" placeholder="Требования, КД, условия"></div>
        <div class="grid2c">
          <div class="field"><label>Заявка (потребность)</label><select id="fOrder"><option value="">— нет —</option></select></div>
          <div class="field"><label>Исполнитель (логин)</label><input type="text" id="fAssignee" placeholder="supply"></div>
        </div>
        <div class="grid2c">
          <div class="field"><label>Категория</label><input type="text" id="fCategory" placeholder="Металлопрокат"></div>
          <div class="field"><label>Материал</label><input type="text" id="fMaterial" placeholder="Сталь 40Х, круг"></div>
        </div>
        <div class="grid2c">
          <div class="field"><label>Кол-во</label><input type="text" id="fQty" inputmode="decimal" placeholder="125"></div>
          <div class="field"><label>Ед.</label><input type="text" id="fUnit" placeholder="кг"></div>
        </div>
        <div class="grid2c">
          <div class="field"><label>Заказчик</label><input type="text" id="fCustomer" placeholder="ООО «Привод»"></div>
          <div class="field"><label>Срок подачи КП</label><input type="date" id="fDeadline"></div>
        </div>
        <button class="btn" id="createBtn">Опубликовать закупку</button>
      </div>
    </section>

    <section class="screen" id="s-detail">
      <button class="back" id="back2">← К списку</button>
      <div class="card" id="detail"></div>
      <div class="card">
        <h2>Предложения поставщиков</h2>
        <div id="bids"><span class="note">—</span></div>
        <div class="msg" id="dMsg"></div>
      </div>
      <div class="card">
        <h2>Статус закупки</h2>
        <div class="grid2c">
          <div class="field"><label>Статус</label>
            <select id="dStatus"><option value="open">Открыта</option><option value="closed">Закрыта</option></select>
          </div>
        </div>
        <button class="btn secondary" id="stBtn">Сохранить статус</button>
      </div>
    </section>
  </main>

  <footer class="foot">3DMP Service · закупки</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=4"></script>
  <script src="../../assets/js/auth.js?v=6"></script>
  <script src="../../assets/js/router.js?v=1"></script>
  <script src="../../assets/js/notify.js?v=2"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=60"></script>
  <script src="procurement.js?v=2"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
  <script src="../../assets/js/module-info.js?v=1"></script>
</body>
</html>
