<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Закупки — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=2">
<style>
  .tcard { background:#fff; border:1px solid var(--border); border-radius:var(--r); padding:14px 16px; cursor:pointer; transition:.15s; }
  .tcard:hover { border-color:var(--accent); transform:translateY(-1px); }
  .tlist { display:flex; flex-direction:column; gap:12px; }
  .b { font-size:.68rem; font-weight:700; border-radius:999px; padding:3px 10px; }
  .b.open { background:#dbeafe; color:#1d4ed8; }
  .b.awarded { background:var(--accent-100); color:var(--accent-700); }
  .b.closed { background:#f1f5f9; color:#64748b; }
  .b.submitted { background:#f1f5f9; color:#475569; }
  .b.accepted { background:var(--accent-100); color:var(--accent-700); }
  .b.rejected { background:#fee2e2; color:#b91c1c; }
  .bid { border:1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:10px; }
  .kvr { display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--border); font-size:.85rem; }
  .kvr:first-child{border-top:none}.kvr .k{color:var(--muted);min-width:150px}
  .back { background:none;border:none;color:var(--accent-700);font-weight:700;cursor:pointer;font-size:.84rem;margin-bottom:10px; }
  .grid2 { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
  @media(max-width:640px){ .grid2{grid-template-columns:1fr} }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🛒</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <section class="screen active" id="s-list">
      <div class="hero"><h1>Закупки</h1><p>Публикация закупок, приём КП, выбор победителя.</p></div>
      <div class="card">
        <button class="btn" id="toCreate" style="width:auto;padding:11px 18px;">＋ Новая закупка</button>
        <div id="listMsg"></div>
        <div class="tlist mt" id="list"><span class="note">Загрузка…</span></div>
      </div>
    </section>

    <section class="screen" id="s-create">
      <button class="back" id="back1">← К списку</button>
      <div class="card">
        <h2>Новая закупка</h2>
        <div class="msg" id="cMsg"></div>
        <div class="field"><label>Название *</label><input type="text" id="fTitle" placeholder="Изготовление пресс-формы"></div>
        <div class="field"><label>Описание</label><input type="text" id="fDesc" placeholder="Требования, КД, условия"></div>
        <div class="grid2">
          <div class="field"><label>Категория</label><input type="text" id="fCategory" placeholder="Оснастка"></div>
          <div class="field"><label>Материал</label><input type="text" id="fMaterial" placeholder="Сталь 40Х"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Кол-во</label><input type="text" id="fQty" inputmode="decimal" placeholder="1"></div>
          <div class="field"><label>Ед.</label><input type="text" id="fUnit" placeholder="компл"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Заказчик</label><input type="text" id="fCustomer" placeholder="ООО «Привод»"></div>
          <div class="field"><label>Срок подачи</label><input type="date" id="fDeadline"></div>
        </div>
        <button class="btn" id="createBtn">Опубликовать закупку</button>
      </div>
    </section>

    <section class="screen" id="s-detail">
      <button class="back" id="back2">← К списку</button>
      <div class="card" id="detail"></div>
      <div class="card">
        <h2>Предложения поставщиков</h2>
        <div id="bids"><span class="note">—</span></div>
        <div class="msg" id="dMsg"></div>
      </div>
      <div class="card">
        <h2>Статус закупки</h2>
        <div class="grid2">
          <div class="field"><label>Статус</label>
            <select id="dStatus"><option value="open">Открыта</option><option value="closed">Закрыта</option></select>
          </div>
        </div>
        <button class="btn secondary" id="stBtn">Сохранить статус</button>
      </div>
    </section>
  </main>

  <footer class="foot">3DMP Service · закупки</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=1"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=1"></script>
  <script src="../../assets/js/auth.js?v=3"></script>
  <script src="../../assets/js/router.js?v=1"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=10"></script>
  <script src="procurement.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
