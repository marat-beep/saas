<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кадры (КЭДО) — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=35">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🧑‍💼</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap fluid">
    <div class="hero"><h1>Кадры (КЭДО)</h1><p>Кадровые документы, ознакомления и подпись (ПЭП; задел под УНЭП/УКЭП/Госключ), шаблоны, личный кабинет, МЧД. Роли: staff.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="tabs2" id="tabs">
      <button data-scr="docs" class="active">Документы</button>
      <button data-scr="me">Мой кабинет</button>
      <button data-scr="tpl">Шаблоны</button>
      <button data-scr="mchd">МЧД</button>
    </div>
    <div class="msg" id="m"></div>

    <section class="screen active" id="scr-docs">
      <div class="card">
        <div class="toolbar">
          <input type="search" class="search" id="q" placeholder="Поиск: сотрудник, название…">
          <select id="status" style="padding:9px;border:1px solid var(--border);border-radius:9px;">
            <option value="">Все</option><option value="draft">Черновик</option><option value="sent">Отправлен</option><option value="signed">Подписан</option><option value="declined">Отклонён</option><option value="archived">Архив</option>
          </select>
          <button class="btn" data-cap="edit" id="add" style="width:auto;padding:8px 14px;">＋ Документ</button>
        </div>
        <div id="docs" class="mt"><span class="note">Загрузка…</span></div>
      </div>
    </section>

    <section class="screen" id="scr-me">
      <div class="card"><div class="toolbar"><button class="btn secondary" id="meBtn" style="width:auto;padding:8px 14px;">Обновить</button>
        <span class="note" style="margin-left:auto;">Документы, адресованные вам: ознакомление и подпись (ПЭП).</span></div>
        <div id="my" class="mt"><span class="note">Загрузка…</span></div></div>
    </section>

    <section class="screen" id="scr-tpl">
      <div class="card"><div class="toolbar"><button class="btn" data-cap="edit" id="addTpl" style="width:auto;padding:8px 14px;">＋ Шаблон</button></div>
        <div id="tpl" class="mt"><span class="note">Загрузка…</span></div></div>
    </section>

    <section class="screen" id="scr-mchd">
      <div class="card"><div class="toolbar"><button class="btn" data-cap="edit" id="addMchd" style="width:auto;padding:8px 14px;">＋ МЧД</button></div>
        <div id="mchd" class="mt"><span class="note">Загрузка…</span></div></div>
    </section>
  </main>

  <footer class="foot">3DMP Service · кадры (КЭДО)</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=4"></script>
  <script src="../../assets/js/auth.js?v=6"></script>
  <script src="../../assets/js/notify.js?v=3"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=108"></script>
  <script src="../../assets/js/shell.js?v=71"></script>
  <script src="kedo.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=2"></script>
  <script src="../../assets/js/module-report.js?v=2"></script>
  <script src="../../assets/js/module-info.js?v=1"></script>
</body>
</html>
