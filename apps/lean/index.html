<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бережливое производство — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=35">
<style>
  
  @media(max-width:680px){}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🌱</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap fluid">
    <div class="hero"><h1>Бережливое производство (B7 · Сессия H)</h1><p>Кайдзен-предложения по 7 видам потерь: статусы, экономия, эффект.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <h2>Новое/редактируемое предложение</h2>
      <div class="msg" id="fMsg"></div>
      <div class="grid3">
        <div class="field"><label>Название *</label><input type="text" id="fTitle"></div>
        <div class="field"><label>Вид потерь</label><select id="fCat">
          <option value="overproduction">Перепроизводство</option><option value="waiting">Ожидание</option>
          <option value="transport">Транспортировка</option><option value="overprocessing">Излишняя обработка</option>
          <option value="inventory">Запасы</option><option value="motion">Движения</option>
          <option value="defects">Дефекты</option><option value="other">Прочее</option></select></div>
        <div class="field"><label>Автор</label><input type="text" id="fAuthor"></div>
        <div class="field"><label>Экономия, ₽/год</label><input type="number" step="any" id="fSavings" value="0"></div>
        <div class="field"><label>Эффект</label><input type="text" id="fEffect"></div>
        <div class="field" style="display:flex;align-items:flex-end;gap:8px;"><button class="btn" id="fSave">Сохранить</button><button class="btn secondary" id="fClear">Очистить</button></div>
      </div>
      <div class="field"><label>Описание</label><input type="text" id="fDescr"></div>
    </div>

    <div class="card">
      <div class="toolbar"><input type="search" class="search" id="q" placeholder="Поиск предложений…"></div>
      <h2>Предложения <span class="note" id="cnt"></span></h2>
      <div class="olist mt" id="list"><span class="note">Загрузка…</span></div>
      <div class="msg" id="mMsg"></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · бережливое производство</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=4"></script>
  <script src="../../assets/js/auth.js?v=6"></script>
  <script src="../../assets/js/notify.js?v=3"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=88"></script>
  <script src="../../assets/js/shell.js?v=50"></script>
  <script src="lean.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=2"></script>
  <script src="../../assets/js/module-info.js?v=1"></script>
</body>
</html>
