<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подразделения — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=17">
<style>
  
  .tree{list-style:none;margin:0;padding:0}
  .tree li{margin:4px 0}
  .node{border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tree ul{list-style:none;margin:2px 0 2px 22px;padding-left:12px;border-left:2px dashed #e2e8f0}
  @media(max-width:680px){}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🏢</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <div class="hero"><h1>Подразделения и иерархия (P13)</h1><p>Дерево структуры организации, руководители, сотрудники. Основа для разграничения доступа.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <h2>Новое/редактируемое подразделение</h2>
      <div class="msg" id="fMsg"></div>
      <div class="grid3">
        <div class="field"><label>Родитель</label><select id="fParent"><option value="">— корневое —</option></select></div>
        <div class="field"><label>Название *</label><input type="text" id="fName"></div>
        <div class="field"><label>Код</label><input type="text" id="fCode" placeholder="PROD"></div>
        <div class="field"><label>Руководитель</label><input type="text" id="fHead"></div>
        <div class="field"><label>Примечание</label><input type="text" id="fNote"></div>
        <div class="field" style="display:flex;align-items:flex-end;gap:8px;"><button class="btn" id="fSave">Сохранить</button><button class="btn secondary" id="fClear">Очистить</button></div>
      </div>
    </div>

    <div class="card">
      <h2>Структура <span class="note" id="cnt"></span></h2>
      <div id="tree" class="mt"><span class="note">Загрузка…</span></div>
      <div class="msg" id="mMsg"></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · подразделения</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=2"></script>
  <script src="../../assets/js/auth.js?v=5"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=55"></script>
  <script src="departments.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
