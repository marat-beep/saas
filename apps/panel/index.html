<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пульт управления — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=17">
<style>
  /* Лейаут панели — только существующие переменные темы, без новых цветов */
  .panel-search { width: 100%; padding: 11px 12px; border: 2px solid var(--border); border-radius: var(--r); margin-bottom: 14px; }
  .panel-layout { display: grid; grid-template-columns: 240px 1fr; gap: 16px; align-items: start; }
  #zoneNav { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .zone-link { display: flex; justify-content: space-between; gap: 8px; padding: 9px 11px; border: 1px solid var(--border); border-radius: var(--r); text-decoration: none; color: var(--text); background: #fff; font-size: .84rem; }
  .zone-link:hover { border-color: var(--accent); }
  .zone-link.on { border-color: var(--accent); background: var(--accent-100, #f1f5f9); }
  .zone-cnt { color: var(--muted); font-weight: 700; }
  .panel-sec { margin-bottom: 20px; scroll-margin-top: 12px; }
  .panel-sec > h2 { display: flex; align-items: center; gap: 8px; font-size: 1rem; margin: 0 0 4px; }
  .panel-sec > p { margin: 0 0 12px; }
  .sec-badge { font-size: .68rem; font-weight: 700; border-radius: 999px; padding: 3px 9px; background: var(--border); color: var(--muted); }
  .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .app-card { border: 1px solid var(--border); border-radius: var(--r); padding: 14px; text-decoration: none; color: var(--text); background: #fff; transition: .15s; display: block; }
  .app-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .app-card .ic { font-size: 1.4rem; }
  .app-card h3 { font-size: .9rem; margin: 8px 0 4px; }
  .app-card p { font-size: .76rem; color: var(--muted); margin: 0; }
  @media (max-width: 768px) {
    .panel-layout { grid-template-columns: 1fr; }
    #zoneNav { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px; }
    .zone-link { white-space: nowrap; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🎛</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <div class="hero"><h1>Пульт управления</h1><p>Единая точка входа. Пять зон по аудиториям: фронтенд, бэкенд, отладка, администраторы организаций, администратор SaaS.</p></div>
    <div class="status" id="conn"><span class="dot wait"></span><span class="status-text">Проверка…</span></div>

    <input type="search" class="panel-search" id="search" placeholder="Поиск модуля по названию или описанию…" aria-label="Поиск модулей">

    <div class="panel-layout">
      <nav id="zoneNav" aria-label="Зоны панели"></nav>
      <div id="sections"></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · пульт управления</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=2"></script>
  <script src="../../assets/js/status.js?v=1"></script>
  <script src="../../assets/js/auth.js?v=5"></script>
  <script src="../../assets/js/catalog.js?v=56"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=51"></script>
  <script src="../../assets/js/shell.js?v=6"></script>
  <script src="panel.js?v=3"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
