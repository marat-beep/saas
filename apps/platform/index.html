<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Платформа — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=8">
<style>
  .tab{width:100%;border-collapse:collapse}.tab th,.tab td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);font-size:.82rem}.tab th{color:var(--muted);font-size:.72rem;text-transform:uppercase}
  .act{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:.74rem;cursor:pointer}.act:hover{border-color:var(--accent);color:var(--accent-700)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🏗</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <div class="hero"><h1>Платформа</h1><p>Управление организациями (только платформенный администратор).</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card">
      <h2>Новая организация</h2>
      <div class="msg" id="cMsg"></div>
      <div class="grid3">
        <div class="field"><label>Название *</label><input type="text" id="tName" placeholder="ООО «Новый Завод»"></div>
        <div class="field"><label>Тариф</label><select id="tPlan"></select></div>
        <div class="field"><label>Логин владельца *</label><input type="text" id="tLogin" placeholder="owner2"></div>
      </div>
      <div class="grid3">
        <div class="field"><label>Пароль владельца</label><input type="text" id="tPass" placeholder="мин. 4"></div>
        <div class="field"><label>Имя владельца</label><input type="text" id="tOwner" placeholder="Иванов И.И."></div>
        <div class="field" style="display:flex;align-items:flex-end;"><button class="btn" id="tCreate">Создать</button></div>
      </div>
    </div>

    <div class="card">
      <h2>Организации <span class="note" id="cnt"></span></h2>
      <div class="toolbar"><input type="search" class="search" id="pq" placeholder="Поиск: организация, тариф, статус…"></div>
      <div class="msg" id="lMsg"></div>
      <div style="overflow:auto;"><table class="tab" id="tenants"></table></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · платформа</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=1"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=2"></script>
  <script src="../../assets/js/auth.js?v=4"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=25"></script>
  <script src="platform.js?v=2"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
