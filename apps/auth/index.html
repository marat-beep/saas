<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">⚙️</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <a class="tbtn" href="../../index.html">← Хаб</a>
  </header>

  <main class="wrap narrow">
    <div class="hero"><h1>Вход в сервис</h1><p>Логин и пароль. Пароли хранятся в виде bcrypt-хешей.</p></div>

    <div class="card">
      <div class="msg" id="msg"></div>
      <form id="form" novalidate>
        <div class="field">
          <label>Логин</label>
          <input type="text" id="login" autocomplete="username" placeholder="supplier" required>
        </div>
        <div class="field">
          <label>Пароль</label>
          <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <button class="btn" type="submit" id="submit">Войти</button>
      </form>
    </div>

    <div class="card muted-card">
      <h3>Демо-доступы</h3>
      <div class="tenant"><span>owner</span><span class="role">Owner12345 · собственник</span></div>
      <div class="tenant"><span>manager</span><span class="role">Manager12345 · менеджер</span></div>
      <div class="tenant"><span>supplier</span><span class="role">Supplier12345 · поставщик</span></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · вход</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js"></script>
  <script src="../../assets/js/supabase-client.js"></script>
  <script src="../../assets/js/ui.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="auth.js"></script>
</body>
</html>
