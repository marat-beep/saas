<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Служба поддержки — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=11">
<style>
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  table.mini{width:100%;border-collapse:collapse;font-size:.84rem}
  table.mini th,table.mini td{border-bottom:1px solid #eef2f7;padding:7px 9px;text-align:left}
  table.mini th{color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase}
  .msg-row{border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin:6px 0;background:#fff}
  .msg-row.int{border-color:var(--warning,#f59e0b);background:#fffbeb}
  @media(max-width:768px){.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🎧</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <div class="hero"><h1>Служба поддержки</h1><p>Тикеты: обращения, переписка, SLA и эскалация, база знаний.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <h2>Новый тикет</h2>
      <div class="msg" id="nMsg"></div>
      <div class="grid3">
        <div class="field" style="grid-column:span 2;"><label>Тема *</label><input type="text" id="nSubject"></div>
        <div class="field"><label>Приоритет</label><select id="nPriority"><option value="low">Низкий</option><option value="normal" selected>Обычный</option><option value="high">Высокий</option><option value="critical">Критический</option></select></div>
        <div class="field"><label>Категория</label><select id="nCategory"><option>Техсбой</option><option>Вопрос</option><option>Доработка</option><option>Доступ</option><option>Оплата</option><option>Другое</option></select></div>
        <div class="field"><label>Уровень (scope)</label><select id="nScope"><option value="internal">Внутренняя поддержка</option><option value="platform">Платформа 3DMP</option></select></div>
        <div class="field"><label>Модуль</label><input type="text" id="nModule"></div>
      </div>
      <div class="field"><label>Описание</label><textarea id="nDesc" rows="3" style="width:100%;padding:9px;border:1px solid var(--border);border-radius:9px;"></textarea></div>
      <button class="btn" id="nCreate">Создать тикет</button>
    </div>

    <div class="card">
      <div class="toolbar">
        <select id="fStatus" style="padding:9px;border:1px solid var(--border);border-radius:9px;"><option value="">Все статусы</option><option value="new">Новые</option><option value="open">Открытые</option><option value="in_progress">В работе</option><option value="waiting">Ожидание</option><option value="resolved">Решённые</option><option value="closed">Закрытые</option></select>
        <select id="fScope" style="padding:9px;border:1px solid var(--border);border-radius:9px;"><option value="">Все уровни</option><option value="internal">Внутренние</option><option value="platform">Платформа</option></select>
        <label class="note"><input type="checkbox" id="fMine"> Только мои</label>
        <button class="btn secondary" id="scanBtn" style="width:auto;padding:8px 14px;">Проверить SLA</button>
      </div>
      <h2>Тикеты <span class="note" id="cnt"></span></h2>
      <div id="list" class="mt"><span class="note">Загрузка…</span></div>
      <div class="msg" id="mMsg"></div>
    </div>

    <div class="card" id="card" style="display:none">
      <h2 id="cardTitle">Тикет</h2>
      <div class="note" id="cardMeta"></div>
      <div class="toolbar mt">
        <select id="cStatus" style="padding:9px;border:1px solid var(--border);border-radius:9px;"><option value="open">Открыт</option><option value="in_progress">В работе</option><option value="waiting">Ожидание</option><option value="resolved">Решён</option><option value="closed">Закрыт</option></select>
        <button class="btn secondary" id="cSet" style="width:auto;padding:8px 14px;">Сменить статус</button>
        <button class="btn secondary" id="cAssign" style="width:auto;padding:8px 14px;">Назначить</button>
        <button class="btn secondary" id="cEsc" style="width:auto;padding:8px 14px;">Эскалировать</button>
        <button class="btn secondary" id="cCsat" style="width:auto;padding:8px 14px;">Оценить (CSAT)</button>
      </div>
      <div id="messages" class="mt"></div>
      <div class="field mt"><label>Ответ</label><textarea id="cBody" rows="3" style="width:100%;padding:9px;border:1px solid var(--border);border-radius:9px;"></textarea></div>
      <label class="note"><input type="checkbox" id="cInternal"> Внутренняя заметка (заявителю не видна)</label>
      <div class="btn-row mt"><button class="btn" id="cReply">Отправить</button><button class="btn secondary" id="cClose">Свернуть</button></div>
      <div class="msg" id="cMsg"></div>
    </div>

    <div class="card">
      <h2>База знаний <span class="note" id="kbCnt"></span></h2>
      <div class="toolbar"><input type="search" class="search" id="kbQ" placeholder="Поиск по статьям…"></div>
      <div id="kbList" class="mt"><span class="note">Загрузка…</span></div>
      <div class="grid3 mt">
        <div class="field"><label>Заголовок статьи</label><input type="text" id="kbT"></div>
        <div class="field"><label>Текст</label><input type="text" id="kbB"></div>
        <div class="field" style="display:flex;align-items:flex-end;gap:8px;"><button class="btn secondary" id="kbSave">Опубликовать</button></div>
      </div>
      <div class="msg" id="kbMsg"></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · служба поддержки</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=1"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=2"></script>
  <script src="../../assets/js/auth.js?v=5"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=46"></script>
  <script src="support.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
