<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Диспетчерская — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=13">
<style>
  .board { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:14px; }
  .col { background:#f8fafc; border:1px solid var(--border); border-radius:var(--r); padding:10px; min-height:120px; }
  .col h3 { font-size:.8rem; text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  .card2 { background:#fff; border:1px solid var(--border); border-radius:10px; padding:10px; margin-bottom:8px; }
  .mini { font-size:.72rem; color:var(--muted); margin-top:4px; }
  .acts { display:flex; gap:5px; margin-top:8px; flex-wrap:wrap; }
  .acts button { border:1px solid var(--border); background:#fff; border-radius:7px; padding:3px 8px; font-size:.68rem; cursor:pointer; }
  .acts button:hover { border-color:var(--accent); color:var(--accent-700); }
  @media(max-width:820px){ .board{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🛠</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <div class="hero"><h1>Диспетчерская (MES)</h1><p>Операции нарядов по рабочим центрам: очередь → работа → пауза → готово. Источник — «Производство».</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <div class="toolbar">
        <select id="mWc" style="padding:10px;border:1px solid var(--border);border-radius:10px;font-size:.85rem;"><option value="">— все центры —</option></select>
        <input type="search" class="search" id="q" placeholder="Поиск: наряд, операция, исполнитель…">
      </div>
      <div class="msg" id="cMsg"></div>
    </div>

    <div class="board">
      <div class="col"><h3>В очереди <span id="cQueued"></span></h3><div id="col-queued"></div></div>
      <div class="col"><h3>В работе <span id="cRunning"></span></h3><div id="col-running"></div></div>
      <div class="col"><h3>Пауза <span id="cPaused"></span></h3><div id="col-paused"></div></div>
      <div class="col"><h3>Выполнено <span id="cDone"></span></h3><div id="col-done"></div></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · диспетчерская</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=1"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=2"></script>
  <script src="../../assets/js/auth.js?v=5"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=25"></script>
  <script src="mes.js?v=2"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
