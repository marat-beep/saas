<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Эскроу — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=35">
<style>
  
  @media(max-width:680px){}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🔒</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap fluid">
    <div class="hero"><h1>Платежи и эскроу (P5)</h1><p>Сделки с заморозкой средств до приёмки работ, комиссия платформы, журнал событий и споры.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <h2>Новая/редактируемая эскроу-сделка</h2>
      <div class="msg" id="fMsg"></div>
      <div class="grid3">
        <div class="field"><label>Заявка</label><select id="fOrder"><option value="">— не выбрана —</option></select></div>
        <div class="field"><label>Сумма, ₽ *</label><input type="number" step="any" id="fAmount" value="0"></div>
        <div class="field"><label>Комиссия, %</label><input type="number" step="any" id="fFee" value="2.5"></div>
        <div class="field"><label>Покупатель</label><input type="text" id="fBuyer"></div>
        <div class="field"><label>Исполнитель</label><input type="text" id="fSeller"></div>
        <div class="field"><label>Этап/веха</label><input type="text" id="fMilestone" placeholder="Отгрузка оснастки"></div>
      </div>
      <div class="field"><label>Примечание</label><input type="text" id="fNote"></div>
      <div class="btn-row mt"><button class="btn" id="fSave">Сохранить</button><button class="btn secondary" id="fClear">Очистить</button></div>
    </div>

    <div class="card">
      <div class="toolbar"><input type="search" class="search" id="q" placeholder="Поиск по номеру/сторонам…"></div>
      <h2>Сделки <span class="note" id="cnt"></span></h2>
      <div class="olist mt" id="list"><span class="note">Загрузка…</span></div>
      <div class="msg" id="mMsg"></div>
    </div>

    <div class="card" id="evCard" style="display:none">
      <h2>Журнал событий <span class="note" id="evTitle"></span></h2>
      <div id="events"></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · эскроу</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=4"></script>
  <script src="../../assets/js/auth.js?v=6"></script>
  <script src="../../assets/js/notify.js?v=3"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=89"></script>
  <script src="../../assets/js/shell.js?v=51"></script>
  <script src="escrow.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=2"></script>
  <script src="../../assets/js/module-info.js?v=1"></script>
</body>
</html>
