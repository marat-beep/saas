<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Маркетплейс мощностей — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=26">
<style>
  
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{padding:8px 14px;border:1px solid var(--border);border-radius:9px;background:#fff;cursor:pointer;font-size:.82rem}
  .tab.active{border-color:var(--accent);color:var(--accent-700);font-weight:700}
  @media(max-width:680px){}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🔗</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap fluid">
    <div class="hero"><h1>Маркетплейс мощностей (M1)</h1><p>Свободные мощности предприятий и заявки на выполнение — кооперация и субподряд.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <div class="tabs">
        <button class="tab active" data-tab="shop">Витрина мощностей</button>
        <button class="tab" data-tab="req">Мои заявки</button>
      </div>

      <div id="tabShop">
        <h2>Разместить мощность</h2>
        <div class="msg" id="lMsg"></div>
        <div class="grid3">
          <div class="field"><label>Название *</label><input type="text" id="lTitle"></div>
          <div class="field"><label>Процесс</label><select id="lProcess"><option value="cnc">ЧПУ</option><option value="edm">ЭЭО</option><option value="grinding">Шлифование</option><option value="heat">Термообработка</option><option value="assembly">Сборка</option><option value="engraving">Гравирование</option><option value="other">Прочее</option></select></div>
          <div class="field"><label>Станок</label><input type="text" id="lMachine"></div>
          <div class="field"><label>Часов/мес</label><input type="number" step="any" id="lCap" value="0"><span class="hint">Свободная мощность в месяц для кооперации.</span></div>
          <div class="field"><label>Цена от, ₽</label><input type="number" step="any" id="lPrice" value="0"></div>
          <div class="field"><label>Регион</label><input type="text" id="lRegion"></div>
          <div class="field"><label>Срок, дней</label><input type="number" id="lLead" value="14"></div>
        </div>
        <button class="btn mt" id="lSave">Разместить</button>

        <h2 class="mt">Витрина <span class="note" id="cnt"></span></h2>
        <div class="toolbar"><input type="search" class="search" id="q" placeholder="Поиск по названию/станку/региону…"></div>
        <div class="olist mt" id="shop"><span class="note">Загрузка…</span></div>
      </div>

      <div id="tabReq" style="display:none">
        <h2>Заявки на выполнение</h2>
        <div class="olist mt" id="reqList"><span class="note">Загрузка…</span></div>
        <div class="msg" id="rMsg"></div>
      </div>
    </div>
  </main>

  <footer class="foot">3DMP Service · маркетплейс</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=4"></script>
  <script src="../../assets/js/auth.js?v=6"></script>
  <script src="../../assets/js/notify.js?v=2"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=56"></script>
  <script src="marketplace.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
  <script src="../../assets/js/module-info.js?v=1"></script>
</body>
</html>
