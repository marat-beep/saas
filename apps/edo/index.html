<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Документооборот (ЭДО) — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=36">
<style>.num{text-align:right;font-variant-numeric:tabular-nums}</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">📨</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap fluid">
    <div class="hero"><h1>Документооборот (ЭДО)</h1><p>Входящие/исходящие/внутренние/ОРД: регистрация, поручения, связи с объектами, номенклатура дел. Роли: staff.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="tabs2" id="tabs">
      <button data-scr="reg" class="active">Реестр</button>
      <button data-scr="nom">Номенклатура дел</button>
    </div>
    <div class="msg" id="m"></div>

    <section class="screen active" id="scr-reg">
      <div class="card">
        <div class="toolbar">
          <input type="search" class="search" id="q" placeholder="Поиск: заголовок, номер, корреспондент…">
          <select id="kind" style="padding:9px;border:1px solid var(--border);border-radius:9px;">
            <option value="">Все виды</option><option value="in">Входящие</option><option value="out">Исходящие</option><option value="internal">Внутренние</option><option value="ord">ОРД</option>
          </select>
          <select id="status" style="padding:9px;border:1px solid var(--border);border-radius:9px;">
            <option value="">Все статусы</option><option value="draft">Черновик</option><option value="registered">Зарегистрирован</option><option value="in_work">В работе</option><option value="closed">Закрыт</option><option value="cancelled">Отменён</option>
          </select>
          <button class="btn" data-cap="edit" id="add" style="width:auto;padding:8px 14px;">＋ Документ</button>
        </div>
        <div id="list" class="mt"><span class="note">Загрузка…</span></div>
      </div>
    </section>

    <section class="screen" id="scr-nom">
      <div class="card">
        <div class="toolbar"><button class="btn" data-cap="edit" id="addNom" style="width:auto;padding:8px 14px;">＋ Дело</button>
          <span class="note" style="margin-left:auto;">Номенклатура дел и архив: документ относится к делу (закрывается).</span></div>
        <div id="nom" class="mt"><span class="note">Загрузка…</span></div>
      </div>
    </section>
  </main>

  <footer class="foot">3DMP Service · документооборот</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=4"></script>
  <script src="../../assets/js/auth.js?v=6"></script>
  <script src="../../assets/js/notify.js?v=3"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=108"></script>
  <script src="../../assets/js/shell.js?v=73"></script>
  <script src="edo.js?v=3"></script>
  <script src="../../assets/js/realtime.js?v=2"></script>
  <script src="../../assets/js/module-report.js?v=3"></script>
  <script src="../../assets/js/module-info.js?v=2"></script>
</body>
</html>
