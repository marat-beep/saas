<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ-помощник — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=36">
<style>
  .tabs2{display:flex;gap:4px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:14px;width:fit-content}
  .tabs2 button{padding:8px 16px;border:none;background:transparent;border-radius:8px;font-weight:600;font-size:.82rem;color:var(--muted);cursor:pointer}
  .tabs2 button.active{background:#fff;color:var(--text);box-shadow:0 1px 4px rgba(15,23,42,.08)}
  .ask{display:flex;gap:8px}
  .ask input{flex:1}
  .ans{background:#f8fafc;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:12px}
  .ans h4{font-size:.86rem;margin-bottom:4px}
  .ans .cat{font-size:.68rem;font-weight:700;color:var(--accent-700);text-transform:uppercase}
  .ans p{font-size:.84rem;line-height:1.55;margin-top:4px}
  .rec{background:#f0fdf4;border:1px solid #6ee7b7;border-radius:12px;padding:12px 14px;margin-top:8px}
  .rec b{font-size:.9rem}
  .ac{position:relative}
  .ac-panel{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 26px rgba(15,23,42,.14);max-height:240px;overflow:auto}
  .ac-panel[hidden]{display:none}
  .ac-item{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:.84rem}
  .ac-item b{font-weight:600}
  .ac-item .g{color:var(--muted);font-size:.72rem;white-space:nowrap}
  .ac-item:hover,.ac-item.on{background:#f0fdf4}
  .ac-empty{padding:10px 12px;color:var(--muted);font-size:.8rem}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:5px 11px;border:1px solid var(--border);border-radius:999px;background:#fff;font-size:.74rem;color:#334155;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--accent-700)}
  @media(max-width:680px){}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🤖</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap fluid">
    <div class="hero"><h1>ИИ-помощник</h1><p>Подбор технологии и поиск по базе знаний организации.</p></div>
    <div id="masters" class="mt"></div>

    <div class="tabs2" id="tabs">
      <button class="active" data-t="ask">Помощник</button>
      <button data-t="kb">База знаний</button>
    </div>

    <section class="tab" id="t-ask">
      <div class="card">
        <h2>Спросите</h2>
        <div class="ask">
          <input type="text" id="q" placeholder="Например: допуск на отверстие 12H7 / hole tolerance / grinding wheel">
          <button class="btn" id="askBtn" style="width:auto;padding:11px 18px;">Найти</button>
        </div>
        <div class="chips mt" id="qChips">
          <button class="chip" data-q="режим фрезерования стали">режим фрезерования стали</button>
          <button class="chip" data-q="латунь точение">латунь точение</button>
          <button class="chip" data-q="хонингование сталь">хонингование сталь</button>
          <button class="chip" data-q="допуск на отверстие 12H7">допуск 12H7</button>
          <button class="chip" data-q="grinding wheel">grinding wheel</button>
        </div>
        <div class="btn-row mt">
          <button class="btn secondary" id="cutBtn">📐 Режимы резания по запросу</button>
          <button class="btn secondary" id="toPick">🔧 Подобрать технологию</button>
          <button class="btn" id="twBtn">🧭 Мастер техпроцесса</button>
        </div>
        <div id="results" class="mt"></div>
        <div id="cutRes" class="mt"></div>
      </div>
      <div class="card">
        <h2>Подбор технологии</h2>
        <div class="grid2">
          <div class="field"><label>Материал</label><div class="ac" id="acWrap"><input type="text" id="rMat" placeholder="Сталь 40Х / steel 40X" autocomplete="off"><div class="ac-panel" id="acPanel" hidden></div></div><span class="hint">Начните вводить (рус. или англ.) — выберите марку из списка.</span></div>
          <div class="field"><label>Признак</label><select id="rFeat">
            <option value="отверстие">Отверстие (hole)</option><option value="паз">Паз (slot)</option>
            <option value="резьба">Резьба (thread)</option><option value="плоскость">Плоскость (face)</option>
            <option value="шлифование">Шлифование (grinding)</option><option value="точение">Точение (turning)</option>
            <option value="фрезерование">Фрезерование (milling)</option></select><span class="hint">Какие правила подбирать.</span></div>
        </div>
        <div class="btn-row mt">
          <button class="btn" id="recBtn">Рекомендовать</button>
          <button class="btn secondary" id="afBtn">✨ Автонаполнить правила</button>
        </div>
        <div id="rec" class="mt"></div>
      </div>
    </section>

    <section class="tab" id="t-kb" style="display:none;">
      <div class="card">
        <h2>Добавить в базу знаний</h2>
        <div class="msg" id="kMsg"></div>
        <div class="grid3">
          <div class="field"><label>Категория</label><input type="text" id="kCat" placeholder="Обработка"></div>
          <div class="field"><label>Вопрос *</label><input type="text" id="kQ" placeholder="Как выбрать подачу?"></div>
          <div class="field"><label>Теги</label><input type="text" id="kTags" placeholder="фрезеровка подача"></div>
        </div>
        <div class="field"><label>Ответ *</label><input type="text" id="kA" placeholder="Рекомендация…"></div>
        <button class="btn" id="kAdd">Добавить</button>
      </div>
      <div class="card"><h2>База знаний</h2><div id="kb"><span class="note">Загрузка…</span></div></div>
    </section>
  </main>

  <footer class="foot">3DMP Service · помощник</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=4"></script>
  <script src="../../assets/js/auth.js?v=7"></script>
  <script src="../../assets/js/notify.js?v=3"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=108"></script>
  <script src="../../assets/js/shell.js?v=75"></script>
  <script src="../../assets/js/wizard.js?v=1"></script>
  <script src="../../assets/js/tech-wizard.js?v=4"></script>
  <script src="../../assets/js/masters.js?v=4"></script>
  <script src="assistant.js?v=6"></script>
  <script src="../../assets/js/realtime.js?v=2"></script>
  <script src="../../assets/js/module-info.js?v=2"></script>
</body>
</html>
