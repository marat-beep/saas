<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Реверс-инжиниринг — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=32">
<style>
  
  @media(max-width:760px){}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🔄</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap fluid">
    <div class="hero"><h1>Реверс-инжиниринг (A6)</h1><p>Заявки на обратное проектирование: метод съёма, результат, статусы.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <h2>Новая/редактируемая заявка</h2>
      <div class="msg" id="fMsg"></div>
      <div class="grid3">
        <div class="field"><label>Изделие/название *</label><input type="text" id="fTitle"></div>
        <div class="field"><label>Заказчик</label><input type="text" id="fCustomer"></div>
        <div class="field"><label>Деталь</label><input type="text" id="fPart"></div>
        <div class="field"><label>Метод съёма</label><select id="fMethod"><option value="scan">3D-скан</option><option value="measure">Обмер</option><option value="drawing">По чертежу</option><option value="photo">По фото</option><option value="sample">По образцу</option></select></div>
        <div class="field"><label>Результат</label><select id="fResult"><option value="model">3D-модель</option><option value="drawing">Чертёж</option><option value="both">Модель + чертёж</option></select></div>
        <div class="field"><label>Исполнитель</label><input type="text" id="fAssignee"></div>
      </div>
      <div class="btn-row"><button class="btn" id="fSave">Сохранить</button><button class="btn secondary" id="fClear">Очистить</button></div>
    </div>

    <div class="card">
      <div class="toolbar"><input type="search" class="search" id="q" placeholder="Поиск по изделию/заказчику/детали…"></div>
      <h2>Заявки <span class="note" id="cnt"></span></h2>
      <div class="olist mt" id="list"><span class="note">Загрузка…</span></div>
      <div class="msg" id="mMsg"></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · реверс-инжиниринг</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=4"></script>
  <script src="../../assets/js/auth.js?v=6"></script>
  <script src="../../assets/js/notify.js?v=2"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=62"></script>
  <script src="reverse.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
  <script src="../../assets/js/module-info.js?v=1"></script>
</body>
</html>
