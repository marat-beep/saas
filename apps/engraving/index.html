<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гравирование — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=7">
<style>
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:680px){.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🔡</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <div class="hero"><h1>Реестр гравирования</h1><p>Заказы на гравировку/маркировку: заявка, деталь, станок, номер гравировки, время и дата отгрузки. Прототип B36.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <h2>Новый/редактируемый заказ на гравирование</h2>
      <div class="msg" id="fMsg"></div>
      <div class="grid3">
        <div class="field"><label>Заявка</label><select id="fOrder"><option value="">— не выбрана —</option></select></div>
        <div class="field"><label>Деталь/описание</label><input type="text" id="fDetail" placeholder="Маркировка партии"></div>
        <div class="field"><label>Станок/маркер</label><input type="text" id="fMachine" placeholder="Лазерный маркер"></div>
        <div class="field"><label>Номер гравировки</label><input type="text" id="fGnum" placeholder="G-2026-001"></div>
        <div class="field"><label>Время, мин</label><input type="number" step="any" id="fMinutes" value="30"></div>
        <div class="field"><label>Дата отгрузки</label><input type="date" id="fShip"></div>
      </div>
      <div class="field"><label>Примечание</label><input type="text" id="fNote"></div>
      <div class="btn-row mt"><button class="btn" id="fSave">Сохранить</button><button class="btn secondary" id="fClear">Очистить</button></div>
    </div>

    <div class="card">
      <div class="toolbar"><input type="search" class="search" id="q" placeholder="Поиск по детали/номеру/заявке…"></div>
      <h2>Заказы <span class="note" id="cnt"></span></h2>
      <div class="olist mt" id="list"><span class="note">Загрузка…</span></div>
      <div class="msg" id="mMsg"></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · гравирование</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=1"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=2"></script>
  <script src="../../assets/js/auth.js?v=4"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=25"></script>
  <script src="engraving.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
