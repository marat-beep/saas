<style>
  
  
  
  .st{padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap}
  .st.on{background:#dcfce7;color:#166534}.st.used{background:#dbeafe;color:#1e40af}

  <header class="topbar">

        <label class="note">Профиль предприятия:</label>

          <option value="mid" selected>Средний завод (10–50)</option>
          <option value="large">Крупное (50+, мультизавод)</option>
        </select>
      </div>
      <div id="map"><span class="note">Загрузка…</span></div>
