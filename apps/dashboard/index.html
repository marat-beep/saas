<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный кабинет — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=5">
<style>
  .mod { display:flex; align-items:center; gap:13px; padding:13px 0; border-top:1px solid var(--border); }
  .mod:first-child { border-top:none; }
  .mod-ic { width:42px; height:42px; border-radius:12px; background:var(--accent-100); display:flex; align-items:center; justify-content:center; font-size:1.25rem; flex:0 0 auto; }
  .mod-tx { flex:1; min-width:0; }
  .mod-tx b { display:block; font-size:.94rem; }
  .mod-tx span { display:block; font-size:.76rem; color:var(--muted); margin-top:2px; line-height:1.45; }
  .mod-btn { background:var(--accent); color:#fff !important; text-decoration:none; border-radius:10px; padding:10px 18px; font-size:.8rem; font-weight:700; white-space:nowrap; }
  .mod-btn:hover { background:var(--accent-700); }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">⚙️</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout" style="display:none;">Выйти</button>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Личный кабинет</h1>
      <p>Данные вашей учётной записи и роль в сервисе.</p>
    </section>

    <div class="card">
      <h2>Аккаунт</h2>
      <div id="profile"><span class="note">Загрузка…</span></div>
    </div>

    <div class="card">
      <h2>Модули</h2>
      <div id="modules"></div>
    </div>

    <div class="card">
      <h2>Последние действия</h2>
      <div id="events"><span class="note">Загрузка…</span></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · кабинет</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=1"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=2"></script>
  <script src="../../assets/js/auth.js?v=4"></script>
  <script src="../../assets/js/catalog.js?v=25"></script>
  <script src="dashboard.js?v=5"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=24"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
</body>
</html>
