<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Гид по системе — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=36">
<style>
  .guide-grp { margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; align-items: start; }
  .guide-grp > h2 { grid-column: 1 / -1; font-size: 1rem; margin: 2px 0; }
  .mod { border: 1px solid var(--border); border-radius: var(--r); background: #fff; padding: 10px 14px; margin: 0; }
  .mod summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; font-weight: 700; font-size: .92rem; }
  .mod summary::-webkit-details-marker { display: none; }
  .mod summary::after { content: '▾'; margin-left: 8px; color: var(--muted); font-weight: 400; transition: transform .15s; }
  .mod[open] summary::after { transform: rotate(180deg); }
  .mod .mod-t { flex: 1; min-width: 0; }
  .mod .mod-body { padding-top: 8px; }
  .mod h3 { font-size: .92rem; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .g-tools { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .g-tools .searchbar { flex: 1; }
  .mod .purp { font-size: .82rem; color: #334155; margin: 6px 0; }
  .mod ul { margin: 6px 0 8px 18px; padding: 0; font-size: .76rem; color: var(--muted); }
  .mod .chips, .mod .io { margin-top: auto; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: .7rem; border: 1px solid var(--border); border-radius: 999px; padding: 3px 9px; text-decoration: none; color: #475569; background: #f8fafc; }
  .chip:hover { border-color: var(--accent); color: var(--accent-700); }
  .io { font-size: .74rem; color: var(--muted); margin-top: 8px; }
  .aud { font-size: .62rem; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: #eef2f7; color: #475569; }
  .searchbar { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; font-size: .9rem; }
  .tbl { width: 100%; border-collapse: collapse; }
  .tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: .82rem; vertical-align: top; }
  .tbl th { color: var(--muted); font-size: .72rem; text-transform: uppercase; }
  .tbl-wrap { overflow: auto; margin-top: 8px; }
  #gf h3 { margin: 4px 0 6px; }
  #gf h4 { margin: 14px 0 4px; font-size: .88rem; }
  .gf-list { margin: 6px 0 6px 20px; padding: 0; font-size: .85rem; line-height: 1.65; }
  .gf-tbl th:nth-child(1), .gf-tbl td:nth-child(1) { width: 22%; }
  .gf-tbl th:nth-child(2), .gf-tbl td:nth-child(2) { width: 30%; }
  .gf-tbl th:nth-child(3), .gf-tbl td:nth-child(3) { width: auto; }
  .gf-tbl th:nth-child(4), .gf-tbl td:nth-child(4) { width: 110px; }
  .gf-tbl .c { text-align: center; }
  .gf-tbl tbody tr:hover { background: #f8fafc; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">📖</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout" style="display:none;">Выйти</button>
  </header>

  <main class="wrap fluid">
    <div class="sv-actions" style="margin:10px 0;"><button class="btn secondary" data-report="knowledge" data-title="База знаний">Отчёт PDF</button></div>

    <div class="hero"><h1>Гид по системе</h1><p>Какой модуль за что отвечает, как связан с другими и кому доступен. Данные — из единого каталога.</p></div>
    <div class="card">
      <div class="g-tools">
        <input type="search" class="searchbar" id="q" placeholder="Поиск: модуль, функция, связь…">
        <button class="btn secondary" id="collapseAll" type="button" style="width:auto;padding:11px 16px;white-space:nowrap;">⇕ Свернуть всё</button>
      </div>
    </div>
    <div id="guide"></div>
  </main>

  <footer class="foot">3DMP Service · гид по системе</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script src="../../assets/js/nav.js?v=108"></script>
  <script src="../../assets/js/shell.js?v=73"></script>
  <script src="../../assets/js/module-report.js?v=3"></script>
  <script src="fields.js?v=2"></script>
  <script src="guide.js?v=8"></script>
  <script src="../../assets/js/module-info.js?v=2"></script>
</body>
</html>
