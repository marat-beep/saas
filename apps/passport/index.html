<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Паспорта изделий — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=2">
<style>
  .pcard { background:#fff; border:1px solid var(--border); border-radius:var(--r); padding:13px 15px; cursor:pointer; }
  .pcard:hover { border-color:var(--accent); }
  .plist { display:flex; flex-direction:column; gap:10px; }
  .kvr{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:.85rem}.kvr:first-child{border-top:none}.kvr .k{color:var(--muted);min-width:130px}
  .back{background:none;border:none;color:var(--accent-700);font-weight:700;cursor:pointer;font-size:.84rem;margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .qrbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .qrbox canvas, .qrbox img { border:1px solid var(--border); border-radius:8px; background:#fff; }
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🪪</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <section class="screen active" id="s-list">
      <div class="hero"><h1>Паспорта изделий</h1><p>Цифровой паспорт: изделие, заявка, контроль, QR-метка.</p></div>
      <div class="card">
        <button class="btn" id="toNew" style="width:auto;padding:11px 18px;">＋ Новый паспорт</button>
        <div id="listMsg"></div>
        <div class="plist mt" id="list"><span class="note">Загрузка…</span></div>
      </div>
    </section>

    <section class="screen" id="s-new">
      <button class="back" id="back1">← К списку</button>
      <div class="card">
        <h2>Новый паспорт</h2>
        <div class="msg" id="nMsg"></div>
        <div class="field"><label>Изделие *</label><input type="text" id="pProduct" placeholder="Кронштейн"></div>
        <div class="grid2">
          <div class="field"><label>Заявка</label><select id="pOrder"><option value="">— нет —</option></select></div>
          <div class="field"><label>Чек-лист ОТК</label><select id="pQc"><option value="">— нет —</option></select></div>
        </div>
        <div class="field"><label>Материал</label><input type="text" id="pMaterial" placeholder="Сталь 40Х"></div>
        <div class="field"><label>Примечание</label><input type="text" id="pNote" placeholder="партия, особенности"></div>
        <button class="btn" id="createBtn">Создать паспорт</button>
      </div>
    </section>

    <section class="screen" id="s-item">
      <button class="back" id="back2">← К списку</button>
      <div class="card" id="passport"></div>
      <div class="card">
        <h2>QR-метка</h2>
        <div class="qrbox">
          <div id="qr"></div>
          <div class="note" id="qrText"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">3DMP Service · паспорта</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="../../assets/js/config.js?v=1"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=1"></script>
  <script src="../../assets/js/auth.js?v=3"></script>
  <script src="../../assets/js/router.js?v=1"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=10"></script>
  <script src="passport.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
