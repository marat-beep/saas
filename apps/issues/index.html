<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Проблемы — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=8">
<style>
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  @media(max-width:680px){.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🚨</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <div class="hero"><h1>Проблемы и эскалация</h1><p>Проблемы с приоритетом, сроком и статусом; эскалация руководству. Прототип B24.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <h2>Новая проблема</h2>
      <div class="msg" id="fMsg"></div>
      <div class="grid3">
        <div class="field"><label>Тема *</label><input type="text" id="fTitle" placeholder="Простой станка / задержка…"></div>
        <div class="field"><label>Приоритет</label><select id="fPriority"><option value="low">Низкий</option><option value="normal" selected>Обычный</option><option value="high">Высокий</option><option value="critical">Критический</option></select></div>
        <div class="field"><label>Исполнитель</label><input type="text" id="fAsg" placeholder="master / supply"></div>
      </div>
      <div class="grid3">
        <div class="field"><label>Срок</label><input type="date" id="fDue"></div>
        <div class="field"><label>Оборудование</label><select id="fEq"><option value="">— нет —</option></select></div>
        <div class="field"><label>Заявка</label><select id="fOrder"><option value="">— нет —</option></select></div>
      </div>
      <div class="field"><label>Описание</label><input type="text" id="fDescr" placeholder="детали проблемы"></div>
      <button class="btn" id="fAdd">Добавить проблему</button>
    </div>

    <div class="card">
      <div class="toolbar"><input type="search" class="search" id="q" placeholder="Поиск: тема, исполнитель…"></div>
      <h2>Проблемы <span class="note" id="cnt"></span></h2>
      <div class="olist mt" id="list"><span class="note">Загрузка…</span></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · проблемы</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=1"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=2"></script>
  <script src="../../assets/js/auth.js?v=4"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=25"></script>
  <script src="issues.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
