<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Производство — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=2">
<style>
  .ncard { background:#fff; border:1px solid var(--border); border-radius:var(--r); padding:14px 16px; cursor:pointer; transition:.15s; }
  .ncard:hover { border-color:var(--accent); transform:translateY(-1px); }
  .nlist { display:flex; flex-direction:column; gap:12px; }
  .b { font-size:.68rem; font-weight:700; border-radius:999px; padding:3px 10px; }
  .b.open { background:#dbeafe; color:#1d4ed8; }
  .b.in_progress { background:#fef3c7; color:#92400e; }
  .b.closed { background:var(--accent-100); color:var(--accent-700); }
  .opline { display:grid; grid-template-columns:28px 1fr 80px 80px 90px; gap:8px; align-items:center; padding:8px 0; border-top:1px solid var(--border); font-size:.82rem; }
  .opline:first-child { border-top:none; }
  .opline .n { width:24px;height:24px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700; }
  .opline input { padding:6px 8px; font-size:.8rem; }
  .kvr { display:flex; gap:10px; padding:8px 0; border-top:1px solid var(--border); font-size:.85rem; }
  .kvr:first-child{border-top:none}.kvr .k{color:var(--muted);min-width:140px}
  .back { background:none;border:none;color:var(--accent-700);font-weight:700;cursor:pointer;font-size:.84rem;margin-bottom:10px; }
  .grid2 { display:grid;grid-template-columns:1fr 1fr;gap:12px; }
  @media(max-width:640px){ .grid2{grid-template-columns:1fr} .opline{grid-template-columns:24px 1fr 60px 60px 70px} }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🏭</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <section class="screen active" id="s-list">
      <div class="hero"><h1>Производство</h1><p>Наряды и операции: планирование, факт, закрытие.</p></div>
      <div class="card">
        <button class="btn" id="toCreate" style="width:auto;padding:11px 18px;">＋ Новый наряд</button>
        <div id="listMsg"></div>
        <div class="nlist mt" id="list"><span class="note">Загрузка…</span></div>
      </div>
    </section>

    <section class="screen" id="s-create">
      <button class="back" id="back1">← К списку</button>
      <div class="card">
        <h2>Новый наряд</h2>
        <div class="msg" id="cMsg"></div>
        <div class="field"><label>Название *</label><input type="text" id="fTitle" placeholder="Например: Фрезеровка кронштейна"></div>
        <div class="grid2">
          <div class="field"><label>Рабочий центр</label><select id="fWc"></select></div>
          <div class="field"><label>Исполнитель (логин)</label><input type="text" id="fAssignee" placeholder="master / operator"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Заявка (источник)</label><select id="fOrder"><option value="">— без заявки —</option></select></div>
          <div class="field"><label>Срок</label><input type="date" id="fDue"></div>
        </div>
        <button class="btn" id="createBtn">Создать наряд</button>
      </div>
    </section>

    <section class="screen" id="s-detail">
      <button class="back" id="back2">← К списку</button>
      <div class="card" id="detail"><span class="note">Загрузка…</span></div>
      <div class="card">
        <h2>Операции</h2>
        <div class="opline" style="border-top:none;font-size:.72rem;color:var(--muted);"><span></span><span>Операция</span><span>План, ч</span><span>Факт, ч</span><span></span></div>
        <div id="ops"><span class="note">—</span></div>
        <div class="grid2 mt">
          <div class="field"><label>Новая операция</label><input type="text" id="opName" placeholder="Фрезеровка черновая"></div>
          <div class="field"><label>План, ч</label><input type="text" id="opPlan" inputmode="decimal" placeholder="4"></div>
        </div>
        <button class="btn secondary" id="addOp">＋ Добавить операцию</button>
        <div class="msg" id="opMsg"></div>
        <button class="btn mt" id="closeBtn">Закрыть наряд</button>
      </div>
    </section>
  </main>

  <footer class="foot">3DMP Service · производство</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=1"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=1"></script>
  <script src="../../assets/js/auth.js?v=3"></script>
  <script src="../../assets/js/router.js?v=1"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=22"></script>
  <script src="production.js?v=2"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
