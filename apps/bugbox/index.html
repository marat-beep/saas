<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Баг-бокс — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=17">
<style>.num{text-align:right}</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🐞</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <div class="hero"><h1>Баг-бокс</h1><p>Баг-репорты от пользователей: контекст, статусы, разбор для разработчика.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <div class="toolbar">
        <select id="fStatus" style="padding:9px;border:1px solid var(--border);border-radius:9px;"><option value="">Все статусы</option><option value="new">Новые</option><option value="in_work">В работе</option><option value="fixed">Исправлены</option><option value="rejected">Отклонены</option></select>
        <input type="search" class="search" id="q" placeholder="Поиск по описанию/модулю…">
      </div>
      <h2>Баг-репорты <span class="note" id="cnt"></span></h2>
      <div class="olist mt" id="list"><span class="note">Загрузка…</span></div>
      <div class="msg" id="mMsg"></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · баг-бокс</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=3"></script>
  <script src="../../assets/js/auth.js?v=5"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=56"></script>
  <script src="../../assets/js/shell.js?v=11"></script>
  <script src="bugbox.js?v=2"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
