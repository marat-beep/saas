<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Финансы — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=2">
<style>
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .kpi{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:14px}
  .kpi .v{font-size:1.4rem;font-weight:800}.kpi .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;margin-top:3px}
  .icard{background:#fff;border:1px solid var(--border);border-radius:var(--r);padding:13px 15px;cursor:pointer}
  .icard:hover{border-color:var(--accent)}
  .ilist{display:flex;flex-direction:column;gap:10px}
  .b{font-size:.68rem;font-weight:700;border-radius:999px;padding:3px 9px}
  .b.draft{background:#f1f5f9;color:#475569}.b.sent{background:#dbeafe;color:#1d4ed8}
  .b.paid{background:var(--accent-100);color:var(--accent-700)}.b.overdue{background:#fee2e2;color:#b91c1c}.b.cancelled{background:#f1f5f9;color:#94a3b8}
  .kvr{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:.85rem}.kvr:first-child{border-top:none}.kvr .k{color:var(--muted);min-width:130px}
  .back{background:none;border:none;color:var(--accent-700);font-weight:700;cursor:pointer;font-size:.84rem;margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">💵</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <section class="screen active" id="s-list">
      <div class="hero"><h1>Финансы</h1><p>Счета, платежи и дебиторская задолженность.</p></div>
      <div class="kpis" id="kpis"></div>
      <div class="card mt">
        <button class="btn" id="toNew" style="width:auto;padding:11px 18px;">＋ Новый счёт</button>
        <div id="listMsg"></div>
        <div class="ilist mt" id="list"><span class="note">Загрузка…</span></div>
      </div>
    </section>

    <section class="screen" id="s-new">
      <button class="back" id="back1">← К списку</button>
      <div class="card">
        <h2>Новый счёт</h2>
        <div class="msg" id="nMsg"></div>
        <div class="field"><label>Заказчик</label><input type="text" id="fCustomer" placeholder="ООО «Привод»"></div>
        <div class="grid2">
          <div class="field"><label>Сумма, ₽ *</label><input type="text" id="fAmount" inputmode="decimal" placeholder="184000"></div>
          <div class="field"><label>Срок оплаты</label><input type="date" id="fDue"></div>
        </div>
        <div class="field"><label>Заявка</label><select id="fOrder"><option value="">— нет —</option></select></div>
        <div class="field"><label>Примечание</label><input type="text" id="fNote" placeholder="условия оплаты"></div>
        <button class="btn" id="createBtn">Создать счёт</button>
      </div>
    </section>

    <section class="screen" id="s-item">
      <button class="back" id="back2">← К списку</button>
      <div class="card" id="invoice"></div>
      <div class="card">
        <h2>Платёж</h2>
        <div class="msg" id="pMsg"></div>
        <div class="grid2">
          <div class="field"><label>Сумма, ₽</label><input type="text" id="pAmount" inputmode="decimal" placeholder="50000"></div>
          <div class="field"><label>Способ</label><select id="pMethod"><option value="bank">Безнал</option><option value="cash">Наличные</option><option value="card">Карта</option></select></div>
        </div>
        <div class="field"><label>Комментарий</label><input type="text" id="pNote" placeholder="№ платёжки"></div>
        <button class="btn" id="payBtn">Добавить платёж</button>
        <button class="btn secondary mt" id="sendBtn">Отметить «Отправлен»</button>
      </div>
      <div class="card">
        <h2>История платежей</h2>
        <div id="payments"><span class="note">—</span></div>
      </div>
    </section>
  </main>

  <footer class="foot">3DMP Service · финансы</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=1"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=1"></script>
  <script src="../../assets/js/auth.js?v=3"></script>
  <script src="../../assets/js/router.js?v=1"></script>
  <script src="../../assets/js/notify.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=12"></script>
  <script src="finance.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
