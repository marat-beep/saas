<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Финансы — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=18">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">💵</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap">
    <section class="screen active" id="s-list">
      <div class="hero"><h1>Финансы</h1><p>Счета, частичные оплаты и дебиторская задолженность. Связь с заявкой, договором и заказчиком (CRM).</p></div>
      <div class="kpi-row" id="kpis"></div>
      <div class="card mt">
        <div class="toolbar">
          <input type="search" class="search" id="q" placeholder="Поиск: номер счёта, заказчик, заявка…">
          <div class="chips" id="filters">
            <span class="chip active" data-f="">Все</span><span class="chip" data-f="draft">Черновики</span>
            <span class="chip" data-f="sent">Отправлены</span><span class="chip" data-f="paid">Оплачены</span>
            <span class="chip" data-f="overdue">Просрочены</span>
          </div>
          <button class="btn" id="toNew" style="width:auto;padding:11px 18px;">＋ Новый счёт</button>
        </div>
        <div id="listMsg"></div>
        <div class="olist mt" id="list"><span class="note">Загрузка…</span></div>
      </div>
    </section>

    <section class="screen" id="s-new">
      <button class="back" id="back1">← К списку</button>
      <div class="card">
        <h2>Новый счёт</h2>
        <div class="msg" id="nMsg"></div>
        <div class="grid2c">
          <div class="field"><label>Заявка (заказ)</label><select id="fOrder"><option value="">— нет —</option></select></div>
          <div class="field"><label>Заказчик (CRM)</label><select id="fCustomerSel"><option value="">— не выбран —</option></select></div>
        </div>
        <div class="field"><label>Заказчик (если не из CRM)</label><input type="text" id="fCustomer" placeholder="ООО «Привод»"></div>
        <div class="grid2c">
          <div class="field"><label>Сумма, ₽ *</label><input type="text" id="fAmount" inputmode="decimal" placeholder="184000"></div>
          <div class="field"><label>Срок оплаты</label><input type="date" id="fDue"></div>
        </div>
        <div class="grid2c">
          <div class="field"><label>Исполнитель (логин)</label><input type="text" id="fAssignee" placeholder="economist"></div>
          <div class="field"><label>Примечание</label><input type="text" id="fNote" placeholder="условия оплаты"></div>
        </div>
        <button class="btn" id="createBtn">Создать счёт</button>
      </div>
    </section>

    <section class="screen" id="s-item">
      <button class="back" id="back2">← К списку</button>
      <div class="card" id="invoice"></div>
      <div class="card">
        <h2>Добавить платёж</h2>
        <div class="msg" id="pMsg"></div>
        <div class="grid2c">
          <div class="field"><label>Сумма, ₽</label><input type="text" id="pAmount" inputmode="decimal" placeholder="50000"></div>
          <div class="field"><label>Способ</label><select id="pMethod"><option value="bank">Безнал</option><option value="cash">Наличные</option><option value="card">Карта</option></select></div>
        </div>
        <div class="field"><label>Комментарий</label><input type="text" id="pNote" placeholder="№ платёжки"></div>
        <button class="btn" id="payBtn">Добавить платёж</button>
        <div class="toolbar mt">
          <button class="btn secondary" id="sendBtn">Отметить «Отправлен»</button>
          <button class="btn secondary" id="cancelBtn">Отменить счёт</button>
        </div>
      </div>
      <div class="card">
        <h2>История платежей</h2>
        <div id="payments"><span class="note">—</span></div>
      </div>
    </section>
  </main>

  <footer class="foot">3DMP Service · финансы</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=3"></script>
  <script src="../../assets/js/auth.js?v=6"></script>
  <script src="../../assets/js/router.js?v=1"></script>
  <script src="../../assets/js/notify.js?v=2"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=56"></script>
  <script src="finance.js?v=2"></script>
  <script src="../../assets/js/realtime.js?v=1"></script>
</body>
</html>
