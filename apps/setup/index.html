<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Наладка — 3DMP Service</title>
<link rel="stylesheet" href="../../assets/css/app.css?v=32">
<style>
  
  @media(max-width:680px){}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">🔧</span> <a href="../../index.html">3DMP Service</a></div>
    <div class="spacer"></div>
    <span class="who" id="who">…</span>
    <button class="tbtn" id="logout">Выйти</button>
  </header>

  <main class="wrap fluid">
    <div class="hero"><h1>Наладка (B20 · Сессия G)</h1><p>Наладки/переналадки/пробные пуски: план и факт часов, исполнитель, привязка к наряду.</p></div>
    <div class="kpi-row" id="kpis"></div>

    <div class="card mt">
      <h2>Новая/редактируемая наладка</h2>
      <div class="msg" id="fMsg"></div>
      <div class="grid3">
        <div class="field"><label>Наряд</label><select id="fNaryad"><option value="">— не выбран —</option></select></div>
        <div class="field"><label>Оборудование *</label><input type="text" id="fEquip"></div>
        <div class="field"><label>Тип</label><select id="fType"><option value="setup">Наладка</option><option value="changeover">Переналадка</option><option value="trial">Пробный пуск</option><option value="adjust">Подналадка</option></select></div>
        <div class="field"><label>План, ч</label><input type="number" step="any" id="fHours" value="1"><span class="hint">Плановое время наладки (учитывается в загрузке).</span></div>
        <div class="field"><label>Исполнитель</label><input type="text" id="fAssignee"></div>
        <div class="field" style="display:flex;align-items:flex-end;gap:8px;"><button class="btn" id="fSave">Сохранить</button><button class="btn secondary" id="fClear">Очистить</button></div>
      </div>
      <div class="field"><label>Примечание</label><input type="text" id="fNote"></div>
    </div>

    <div class="card">
      <div class="toolbar"><input type="search" class="search" id="q" placeholder="Поиск по оборудованию/исполнителю/наряду…"></div>
      <h2>Наладки <span class="note" id="cnt"></span></h2>
      <div class="olist mt" id="list"><span class="note">Загрузка…</span></div>
      <div class="msg" id="mMsg"></div>
    </div>
  </main>

  <footer class="foot">3DMP Service · наладка</footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../../assets/js/config.js?v=2"></script>
  <script src="../../assets/js/supabase-client.js?v=1"></script>
  <script src="../../assets/js/ui.js?v=4"></script>
  <script src="../../assets/js/auth.js?v=6"></script>
  <script src="../../assets/js/notify.js?v=3"></script>
  <script src="../../assets/js/support-widget.js?v=1"></script>
  <script src="../../assets/js/nav.js?v=64"></script>
  <script src="setup.js?v=1"></script>
  <script src="../../assets/js/realtime.js?v=2"></script>
  <script src="../../assets/js/module-info.js?v=1"></script>
</body>
</html>
