name: audit

# Непрерывный аудит (L0-L2): статик, БД (если задан секрет), трассировка, целостность,
# безопасность, производительность. Формирует audit/*.json и docs/UPDATE_PLAN.md.
# ВАЖНО: `secrets` нельзя использовать в `if` — наличие токена проверяется внутри скрипта.

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit run (L0-L2)
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pwsh -NoProfile -File tools/audit-run.ps1
        continue-on-error: true

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit
          path: |
            audit/
            docs/UPDATE_PLAN.md
            docs/AUDIT_TRACE.md
