name: checks

# Эксплуатационные проверки 3DMP Service:
# локальный аудит (каталог/версии/shell/синтаксис) и смоук БД (если задан секрет).
# ВАЖНО: контекст `secrets` нельзя использовать в `if` — workflow станет «No jobs were run».
# Поэтому наличие токена проверяем внутри шага (env → shell).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit (каталог / версии / shell / синтаксис)
        shell: pwsh
        run: pwsh -NoProfile -File tools/audit.ps1

      - name: DB smoke (пропускается без секрета SUPABASE_ACCESS_TOKEN)
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)) {
            Write-Host 'SUPABASE_ACCESS_TOKEN не задан — db-smoke пропущен.'
            exit 0
          }
          pwsh -NoProfile -File tools/db-smoke.ps1 -Token $env:SUPABASE_ACCESS_TOKEN
