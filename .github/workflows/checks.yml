name: checks

# Эксплуатационные проверки 3DMP Service (W33):
# локальный аудит (каталог/версии/shell/синтаксис) и смоук БД (если задан секрет).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'   # ежедневно 03:00 UTC
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit (каталог / версии / shell / синтаксис)
        shell: pwsh
        run: pwsh -NoProfile -File tools/audit.ps1

      - name: DB smoke (если задан секрет SUPABASE_ACCESS_TOKEN)
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pwsh -NoProfile -File tools/db-smoke.ps1 -Token $env:SUPABASE_ACCESS_TOKEN
