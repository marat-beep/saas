name: checks

# Эксплуатационные проверки 3DMP Service:
# локальный аудит (каталог/версии/shell/синтаксис), offline-проверки
# (целостность БД, безопасность, производительность, UX, API-поверхность, трассировка)
# и смоук БД (если задан секрет). Краснеет при регрессах (Critical/Major находки).
# ВАЖНО: контекст `secrets` нельзя использовать в `if` — workflow станет «No jobs were run».
# Поэтому наличие токена проверяем внутри шага (env → shell).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit (каталог / версии / shell / синтаксис)
        shell: pwsh
        run: pwsh -NoProfile -File tools/audit.ps1

      - name: Offline checks (integrity / security / perf / ux / api / trace)
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/db-integrity.ps1
          pwsh -NoProfile -File tools/security-check.ps1
          pwsh -NoProfile -File tools/perf-check.ps1
          pwsh -NoProfile -File tools/ux-check.ps1
          pwsh -NoProfile -File tools/api-surface.ps1
          pwsh -NoProfile -File tools/trace-matrix.ps1

      - name: Gate (красный при Critical/Major находках)
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Path audit/checks/*.json -ErrorAction SilentlyContinue | ForEach-Object {
            $file = $_.Name
            try { $j = Get-Content $_.FullName -Raw | ConvertFrom-Json } catch { return }
            foreach ($fnd in @($j.findings)) {
              if ($fnd.sev -eq 'Critical' -or $fnd.sev -eq 'Major') {
                Write-Host ("::error::$file — " + $fnd.title)
                $bad++
              }
            }
          }
          if ($bad -gt 0) { Write-Error "Регрессии: $bad критичных находок (см. audit/checks/*.json)."; exit 1 }
          Write-Host 'Offline-проверки: критичных находок нет.'

      - name: DB smoke (пропускается без секрета SUPABASE_ACCESS_TOKEN)
        shell: pwsh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_ACCESS_TOKEN)) {
            Write-Host 'SUPABASE_ACCESS_TOKEN не задан — db-smoke пропущен.'
            exit 0
          }
          pwsh -NoProfile -File tools/db-smoke.ps1 -Token $env:SUPABASE_ACCESS_TOKEN
