<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B20 · Наладка и оснастка — 3DMP</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<style>
  .s-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border-2); cursor:pointer; }
  .s-row:last-child { border-bottom:none; }
  .coord { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border-2); font-size:.8rem; }
  .coord:last-child { border-bottom:none; }
  .coord b { font-family:var(--mono); }
  .chk { display:flex; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--border-2); cursor:pointer; font-size:.82rem; }
  .chk:last-child { border-bottom:none; }
  .chk .box { width:20px;height:20px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.62rem;flex-shrink:0; }
  .chk.done .box { background:var(--accent); border-color:var(--accent); }
  .chk.done .lbl { text-decoration:line-through; color:var(--muted); }
</style>
</head>
<body class="app-body" data-audience="staff">

<div class="app-shell">
  <header class="app-header">
    <button class="back" id="backBtn" hidden>←</button>
    <div class="title-block"><h1 id="headerTitle">Наладка и оснастка</h1><div class="subtitle" id="headerSubtitle">3DMP · Базы и первый пуск</div></div>
    <div class="spacer"></div>
    <button class="header-action" id="homeBtn">Хаб</button>
  </header>

  <div class="content" id="content">

    <section class="screen active" id="s1">
      <div class="section-title">Карты наладки <span class="count" id="sCount"></span></div>
      <div class="card" id="sList"></div>
    </section>

    <section class="screen" id="s2">
      <div class="card accent-left mb-12">
        <div class="row between"><span class="faint" style="font-family:var(--mono);font-size:.72rem;" id="dOrder">—</span><span class="badge" id="dStatus">—</span></div>
        <h3 class="mt-8" id="dTitle">—</h3>
        <div class="tag-row mt-8" id="dTags"></div>
      </div>
      <div class="section-title">Системы координат</div>
      <div class="card" id="dCoords"></div>
      <div class="section-title">Оснастка и щуп</div>
      <div class="card" id="dFixture"></div>
      <div class="section-title">Чек-лист первого пуска</div>
      <div class="card" id="dCheck"></div>
      <button class="btn btn-primary mt-12" id="doneBtn" disabled>Завершить наладку →</button>
    </section>

    <section class="screen" id="s3">
      <div class="result-hero"><div class="check">✓</div><h2 id="actTitle">Наладка завершена</h2><p id="actText">Станок готов к запуску партии.</p></div>
      <div class="ticket mb-16"><div class="t-label">Наладка</div><div class="t-num" id="actNum">—</div></div>
      <button class="btn btn-primary mt-16" id="toList">К картам наладки</button>
      <button class="btn btn-secondary mt-8" id="toHub">Вернуться в хаб</button>
    </section>

  </div>

  <footer class="app-footer">3DMP · Наладка и оснастка · демо-режим</footer>
</div>

<script defer src="../../assets/js/utils.js"></script>
<script defer src="../../assets/js/router.js"></script>
<script defer src="b20.js"></script>
  <script defer src="../../assets/js/catalog.js?v=1"></script>
  <script defer src="../../assets/js/store.js?v=1"></script>
  <script defer src="../../assets/js/auth.js?v=1"></script>
  <script defer src="../../assets/js/theme.js?v=1"></script>
  <script defer src="../../assets/js/guide.js?v=1"></script>
</body>
</html>
