<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B26 · Режимы резания PRO — 3DMP</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<style>
  .tabs2 { display:flex; background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-sm); padding:3px; margin-bottom:14px; }
  .tabs2 button { flex:1; border:none; background:transparent; padding:9px 4px; border-radius:7px; font-weight:700; font-size:.72rem; color:var(--muted); cursor:pointer; }
  .tabs2 button.active { background:var(--surface); color:var(--accent-700); box-shadow:var(--sh-xs); }
  .res-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .res-cell { background:var(--surface-2); border-radius:10px; padding:12px; text-align:center; }
  .res-cell b { display:block; font-size:1.1rem; font-family:var(--mono); } .res-cell span { font-size:.64rem; color:var(--muted); }
  .res-big { background:var(--accent-grad); color:#fff; border-radius:var(--r-md); padding:16px; text-align:center; }
  .res-big .n { font-size:1.8rem; font-weight:800; }
</style>
</head>
<body class="app-body" data-audience="staff">

<div class="app-shell">
  <header class="app-header">
    <button class="back" id="backBtn" hidden>←</button>
    <div class="title-block"><h1 id="headerTitle">Режимы резания PRO</h1><div class="subtitle" id="headerSubtitle">3DMP · S/F · 4 операции</div></div>
    <div class="spacer"></div>
    <button class="header-action" id="homeBtn">Хаб</button>
  </header>

  <div class="content" id="content">

    <section class="screen active" id="s1">
      <div class="tabs2" id="tabs"></div>
      <div id="fields"></div>
      <button class="btn btn-primary mt-12" id="calcBtn">Рассчитать →</button>
    </section>

    <section class="screen" id="s2">
      <div class="res-big mb-12"><div style="font-size:.74rem;opacity:.9;">Частота вращения n</div><div class="n" id="nOut">—</div><div style="font-size:.74rem;opacity:.9;" id="vcOut">—</div></div>
      <div class="res-grid mb-12" id="resGrid"></div>
      <div id="verdict"></div>
      <button class="btn btn-primary mt-12" id="saveBtn">Сохранить в техпроцесс →</button>
      <button class="btn btn-secondary mt-8" id="editBtn">Изменить параметры</button>
    </section>

    <section class="screen" id="s3">
      <div class="result-hero"><div class="check">✓</div><h2>Режимы сохранены</h2><p>Параметры добавлены в техпроцесс (B2/B8/B9).</p></div>
      <div class="ticket mb-16"><div class="t-label">Запись</div><div class="t-num" id="actNum">—</div></div>
      <button class="btn btn-primary mt-16" id="againBtn">Новый расчёт</button>
      <button class="btn btn-secondary mt-8" id="toHub">Вернуться в хаб</button>
    </section>

  </div>

  <footer class="app-footer">3DMP · Режимы резания PRO · демо-режим</footer>
</div>

<script defer src="../../assets/js/utils.js"></script>
<script defer src="../../assets/js/router.js"></script>
<script defer src="b26.js"></script>
  <script defer src="../../assets/js/catalog.js?v=1"></script>
  <script defer src="../../assets/js/store.js?v=1"></script>
  <script defer src="../../assets/js/auth.js?v=1"></script>
  <script defer src="../../assets/js/theme.js?v=1"></script>
  <script defer src="../../assets/js/guide.js?v=1"></script>
</body>
</html>
