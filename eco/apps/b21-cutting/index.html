<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B21 · Режимы резания — 3DMP</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<style>
  .res-big { background:var(--accent-grad); color:#fff; border-radius:var(--r-md); padding:18px; text-align:center; }
  .res-big .n { font-size:1.9rem; font-weight:800; }
  .res-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .res-cell { background:var(--surface-2); border-radius:10px; padding:12px; text-align:center; }
  .res-cell b { display:block; font-size:1.2rem; font-family:var(--mono); }
  .res-cell span { font-size:.66rem; color:var(--muted); }
</style>
</head>
<body class="app-body" data-audience="staff">

<div class="app-shell">
  <header class="app-header">
    <button class="back" id="backBtn" hidden>←</button>
    <div class="title-block"><h1 id="headerTitle">Режимы резания</h1><div class="subtitle" id="headerSubtitle">3DMP · S/F и нагрузка</div></div>
    <div class="spacer"></div>
    <button class="header-action" id="homeBtn">Хаб</button>
  </header>

  <div class="content" id="content">

    <section class="screen active" id="s1">
      <div class="field"><label>Материал заготовки</label><select id="mat"></select></div>
      <div class="field"><label>Материал инструмента</label><select id="tool"></select></div>
      <div class="input-row">
        <div class="field"><label>Диаметр D, мм</label><input type="number" id="d" min="1" value="12"></div>
        <div class="field"><label>Зубьев Z</label><input type="number" id="z" min="1" value="4"></div>
      </div>
      <div class="field"><label>Операция</label><div class="segmented" id="op"><button data-k="0.8" class="active">Черновая</button><button data-k="1.2">Чистовая</button></div></div>
      <div class="input-row">
        <div class="field"><label>Глубина ap, мм</label><input type="number" id="ap" min="0" step="0.1" value="2"></div>
        <div class="field"><label>Ширина ae, мм</label><input type="number" id="ae" min="0" step="0.1" value="6"></div>
      </div>
      <div class="field"><label>Мощность станка, кВт</label><input type="number" id="pw" min="1" value="15"></div>
      <button class="btn btn-primary" id="calcBtn">Рассчитать режимы →</button>
    </section>

    <section class="screen" id="s2">
      <div class="res-big mb-12">
        <div style="font-size:.74rem;opacity:.9;">Частота вращения</div>
        <div class="n" id="nOut">—</div>
        <div style="font-size:.74rem;opacity:.9;" id="vcOut">—</div>
      </div>
      <div class="res-grid mb-12" id="resGrid"></div>
      <div id="verdict"></div>
      <button class="btn btn-primary mt-12" id="saveBtn">Сохранить в техпроцесс →</button>
      <button class="btn btn-secondary mt-8" id="editBtn">Изменить параметры</button>
    </section>

    <section class="screen" id="s3">
      <div class="result-hero"><div class="check">✓</div><h2>Режимы сохранены</h2><p>Параметры S/F добавлены в техпроцесс и доступны в B2/B8.</p></div>
      <div class="ticket mb-16"><div class="t-label">Запись</div><div class="t-num" id="actNum">—</div></div>
      <button class="btn btn-primary mt-16" id="againBtn">Новый расчёт</button>
      <button class="btn btn-secondary mt-8" id="toHub">Вернуться в хаб</button>
    </section>

  </div>

  <footer class="app-footer">3DMP · Режимы резания · демо-режим</footer>
</div>

<script defer src="../../assets/js/utils.js"></script>
<script defer src="../../assets/js/router.js"></script>
<script defer src="b21.js"></script>
  <script defer src="../../assets/js/catalog.js?v=1"></script>
  <script defer src="../../assets/js/store.js?v=1"></script>
  <script defer src="../../assets/js/auth.js?v=1"></script>
  <script defer src="../../assets/js/theme.js?v=1"></script>
  <script defer src="../../assets/js/guide.js?v=1"></script>
</body>
</html>
