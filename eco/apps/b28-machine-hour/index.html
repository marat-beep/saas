<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B28 · Стоимость нормочаса станка — 3DMP</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<style>
  .brk { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border-2); font-size:.82rem; }
  .brk:last-child { border-bottom:none; }
  .brk .bar { height:6px; border-radius:3px; background:var(--accent); margin-top:4px; }
  .big { background:var(--accent-grad); color:#fff; border-radius:var(--r-md); padding:18px; text-align:center; }
  .big .n { font-size:1.9rem; font-weight:800; }
</style>
</head>
<body class="app-body" data-audience="staff">

<div class="app-shell">
  <header class="app-header">
    <button class="back" id="backBtn" hidden>←</button>
    <div class="title-block"><h1 id="headerTitle">Стоимость нормочаса</h1><div class="subtitle" id="headerSubtitle">3DMP · Станок с ЧПУ</div></div>
    <div class="spacer"></div>
    <button class="header-action" id="homeBtn">Хаб</button>
  </header>

  <div class="content" id="content">

    <section class="screen active" id="s1">
      <div class="field"><label>Станок (пресет)</label><select id="preset"></select></div>
      <div class="section-title">Станок и амортизация</div>
      <div class="input-row">
        <div class="field"><label>Цена станка, ₽</label><input type="number" id="price" value="18500000"></div>
        <div class="field"><label>Срок службы, лет</label><input type="number" id="life" value="10"></div>
      </div>
      <div class="input-row">
        <div class="field"><label>Ликвидационная, ₽</label><input type="number" id="salvage" value="1000000"></div>
        <div class="field"><label>Эффективных ч/год</label><input type="number" id="hours" value="3600"></div>
      </div>
      <div class="section-title">Эксплуатация</div>
      <div class="input-row">
        <div class="field"><label>Мощность, кВт</label><input type="number" id="power" value="18"></div>
        <div class="field"><label>Цена кВт·ч, ₽</label><input type="number" id="kwh" value="7" step="0.1"></div>
      </div>
      <div class="input-row">
        <div class="field"><label>Коэф. загрузки</label><input type="number" id="load" value="0.7" step="0.05"></div>
        <div class="field"><label>Расходники, ₽/ч</label><input type="number" id="consume" value="350"></div>
      </div>
      <div class="input-row">
        <div class="field"><label>Ремонт/обсл., ₽/год</label><input type="number" id="maint" value="600000"></div>
        <div class="field"><label>Накладные, %</label><input type="number" id="overhead" value="25"></div>
      </div>
      <div class="section-title">Персонал</div>
      <div class="input-row">
        <div class="field"><label>Оператор, ₽/мес</label><input type="number" id="salary" value="110000"></div>
        <div class="field"><label>Налоги, %</label><input type="number" id="tax" value="30"></div>
      </div>
      <div class="input-row">
        <div class="field"><label>Операторов</label><input type="number" id="operators" value="1"></div>
        <div class="field"><label>Норма ч/мес</label><input type="number" id="norm" value="160"></div>
      </div>
      <div class="input-row">
        <div class="field"><label>Маржа, %</label><input type="number" id="margin" value="30"></div>
        <div class="field"><label>НДС, %</label><input type="number" id="vat" value="22"></div>
      </div>
      <button class="btn btn-primary mt-12" id="calcBtn">Рассчитать →</button>
    </section>

    <section class="screen" id="s2">
      <div class="big mb-12"><div style="font-size:.74rem;opacity:.9;">Себестоимость нормочаса</div><div class="n" id="costOut">—</div><div style="font-size:.74rem;opacity:.9;" id="priceOut">—</div></div>
      <div class="section-title">Структура себестоимости</div>
      <div class="card" id="brkList"></div>
      <div class="section-title">Цена для клиента</div>
      <div class="card" id="priceCard"></div>
      <button class="btn btn-primary mt-12" id="saveBtn">Сохранить нормочас →</button>
      <button class="btn btn-secondary mt-8" id="editBtn">Изменить</button>
    </section>

    <section class="screen" id="s3">
      <div class="result-hero"><div class="check">✓</div><h2>Нормочас сохранён</h2><p>Значение доступно в B31 «Экономика заказа» и B8.</p></div>
      <div class="ticket mb-16"><div class="t-label">Запись</div><div class="t-num" id="actNum">—</div></div>
      <button class="btn btn-primary mt-16" id="againBtn">Новый расчёт</button>
      <button class="btn btn-secondary mt-8" id="toHub">Вернуться в хаб</button>
    </section>

  </div>

  <footer class="app-footer">3DMP · Стоимость нормочаса · демо-режим</footer>
</div>

<script defer src="../../assets/js/utils.js"></script>
<script defer src="../../assets/js/router.js"></script>
<script defer src="b28.js"></script>
  <script defer src="../../assets/js/catalog.js?v=1"></script>
  <script defer src="../../assets/js/store.js?v=1"></script>
  <script defer src="../../assets/js/auth.js?v=1"></script>
  <script defer src="../../assets/js/theme.js?v=1"></script>
  <script defer src="../../assets/js/guide.js?v=1"></script>
</body>
</html>
