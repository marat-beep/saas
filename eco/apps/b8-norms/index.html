<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B8 · Нормирование операций — 3DMP</title>
<link rel="stylesheet" href="../../assets/css/tokens.css?v=1">
<link rel="stylesheet" href="../../assets/css/components.css?v=1">
<style>
  .k-chip { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border-2); font-size:.8rem; }
  .k-chip:last-child { border-bottom:none; }
  .norm-big { background:var(--accent-grad); color:#fff; border-radius:var(--r-md); padding:18px; text-align:center; }
  .norm-big .n { font-size:2rem; font-weight:800; }
</style>
</head>
<body class="app-body" data-audience="staff">

<div class="app-shell">
  <header class="app-header">
    <button class="back" id="backBtn" hidden>←</button>
    <div class="title-block"><h1 id="headerTitle">Нормирование операций</h1><div class="subtitle" id="headerSubtitle">3DMP · Норма и себестоимость</div></div>
    <div class="spacer"></div>
    <button class="header-action" id="homeBtn">Хаб</button>
  </header>

  <div class="content" id="content">

    <section class="screen active" id="s1">
      <div class="field"><label>Операция</label><select id="op"></select></div>
      <div class="field"><label>Материал</label><select id="mat"></select></div>
      <div class="field"><label>Точность</label><div class="segmented" id="prec"><button data-k="1" class="active">Обычная</button><button data-k="1.25">Точная</button><button data-k="1.6">Высокая</button></div></div>
      <div class="field"><label>Сложность геометрии</label><div class="segmented" id="geom"><button data-k="1" class="active">Простая</button><button data-k="1.3">Средняя</button><button data-k="1.7">Сложная</button></div></div>
      <div class="field"><label>Оснастка</label><div class="segmented" id="fix"><button data-k="0.9" class="active">Спецоснастка</button><button data-k="1">Универсальная</button></div></div>
      <div class="field"><label>Количество, шт</label><input type="number" id="qty" min="1" value="1"></div>
      <button class="btn btn-primary" id="calcBtn">Рассчитать норму →</button>
    </section>

    <section class="screen" id="s2">
      <div class="norm-big mb-12">
        <div style="font-size:.74rem;opacity:.9;">Норма времени на деталь</div>
        <div class="n" id="normVal">—</div>
        <div style="font-size:.74rem;opacity:.9;" id="normSub">—</div>
      </div>
      <div class="section-title">Коэффициенты</div>
      <div class="card" id="kList"></div>
      <div class="section-title">Экономика</div>
      <div class="card" id="econList"></div>
      <button class="btn btn-primary mt-12" id="saveBtn">Сохранить в спецификацию →</button>
      <button class="btn btn-secondary mt-8" id="editBtn">Изменить параметры</button>
    </section>

    <section class="screen" id="s3">
      <div class="result-hero"><div class="check">✓</div><h2>Норма сохранена</h2><p>Расчёт добавлен в спецификацию и доступен в B9.</p></div>
      <div class="ticket mb-16"><div class="t-label">Позиция</div><div class="t-num" id="posNum">—</div></div>
      <div class="card" id="savedCard"></div>
      <button class="btn btn-primary mt-16" id="againBtn">Новый расчёт</button>
      <button class="btn btn-secondary mt-8" id="toHub">Вернуться в хаб</button>
    </section>

  </div>

  <footer class="app-footer">3DMP · Нормирование операций · демо-режим</footer>
</div>

<script defer src="../../assets/js/utils.js?v=1"></script>
<script defer src="../../assets/js/router.js?v=1"></script>
<script defer src="b8.js?v=1"></script>
  <script defer src="../../assets/js/catalog.js?v=1"></script>
  <script defer src="../../assets/js/guide.js?v=1"></script>
  <script defer src="../../assets/js/store.js?v=1"></script>
  <script defer src="../../assets/js/auth.js?v=1"></script>
  <script defer src="../../assets/js/theme.js?v=1"></script>
</body>
</html>
