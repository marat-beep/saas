<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B12 · CRM и воронка — 3DMP</title>
<link rel="stylesheet" href="../../assets/css/tokens.css?v=1">
<link rel="stylesheet" href="../../assets/css/components.css?v=1">
<style>
  .funnel-stage { margin-bottom:10px; cursor:pointer; }
  .funnel-stage .fl { display:flex; justify-content:space-between; font-size:.78rem; margin-bottom:4px; }
  .funnel-stage .track { height:26px; border-radius:6px; background:var(--surface-2); overflow:hidden; }
  .funnel-stage .track > i { display:block; height:100%; border-radius:6px; }
  .deal { border-left:4px solid var(--accent); }
</style>
</head>
<body class="app-body" data-audience="staff">

<div class="app-shell">
  <header class="app-header">
    <button class="back" id="backBtn" hidden>←</button>
    <div class="title-block"><h1 id="headerTitle">CRM и воронка</h1><div class="subtitle" id="headerSubtitle">3DMP · Сделки и КП</div></div>
    <div class="spacer"></div>
    <button class="header-action" id="homeBtn">Хаб</button>
  </header>

  <div class="content" id="content">

    <section class="screen active" id="s1">
      <div class="stats mb-16">
        <div class="stat"><div class="num accent" id="cPipeline">—</div><div class="label">Пайплайн</div></div>
        <div class="stat"><div class="num success" id="cWon">—</div><div class="label">Выиграно</div></div>
        <div class="stat"><div class="num info" id="cAvg">—</div><div class="label">Средний чек</div></div>
      </div>
      <div class="section-title">Воронка</div>
      <div class="card" id="funnel"></div>
      <div class="section-title">Сделки <span class="count" id="dealCount"></span></div>
      <div id="dealList"></div>
    </section>

    <section class="screen" id="s2">
      <div class="card deal mb-12">
        <div class="row between"><span class="faint" style="font-family:var(--mono);font-size:.72rem;" id="dClient">—</span><span class="badge" id="dStage">—</span></div>
        <h3 class="mt-8" id="dTitle">—</h3>
        <div class="tag-row mt-8" id="dTags"></div>
      </div>
      <div class="section-title">Параметры</div>
      <div class="card" id="dInfo"></div>
      <div class="btn-row"><button class="btn btn-primary" id="nextBtn">Следующая стадия →</button></div>
      <button class="btn btn-secondary mt-8" id="kpBtn">Оформить КП</button>
    </section>

    <section class="screen" id="s3">
      <div class="result-hero"><div class="check">✓</div><h2 id="actTitle">Готово</h2><p id="actText">Сделка обновлена.</p></div>
      <div class="ticket mb-16"><div class="t-label">Сделка</div><div class="t-num" id="actNum">—</div></div>
      <button class="btn btn-primary mt-16" id="toList">К сделкам</button>
      <button class="btn btn-secondary mt-8" id="toHub">Вернуться в хаб</button>
    </section>

  </div>

  <footer class="app-footer">3DMP · CRM и воронка · демо-режим</footer>
</div>

<script defer src="../../assets/js/utils.js?v=1"></script>
<script defer src="../../assets/js/router.js?v=1"></script>
<script defer src="b12.js?v=1"></script>
  <script defer src="../../assets/js/catalog.js?v=1"></script>
  <script defer src="../../assets/js/guide.js?v=1"></script>
  <script defer src="../../assets/js/store.js?v=1"></script>
  <script defer src="../../assets/js/auth.js?v=1"></script>
  <script defer src="../../assets/js/theme.js?v=1"></script>
</body>
</html>
