<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B11 · Наряды — 3DMP</title>
<link rel="stylesheet" href="../../assets/css/tokens.css?v=1">
<link rel="stylesheet" href="../../assets/css/components.css?v=1">
<style>
  .op-line { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border-2); }
  .op-line:last-child { border-bottom:none; }
  .op-line .on { width:26px;height:26px;border-radius:50%;background:var(--accent-100);color:var(--accent-700);font-weight:800;font-size:.72rem;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
</style>
</head>
<body class="app-body" data-audience="staff">

<div class="app-shell">
  <header class="app-header">
    <button class="back" id="backBtn" hidden>←</button>
    <div class="title-block"><h1 id="headerTitle">Наряды</h1><div class="subtitle" id="headerSubtitle">3DMP · Сменные задания</div></div>
    <div class="spacer"></div>
    <button class="header-action" id="homeBtn">Хаб</button>
  </header>

  <div class="content" id="content">

    <section class="screen active" id="s1">
      <div class="section-title">Наряды <span class="count" id="nCount"></span></div>
      <div id="nList"></div>
    </section>

    <section class="screen" id="s2">
      <div class="card accent-left mb-12">
        <div class="row between"><span class="faint" style="font-family:var(--mono);font-size:.72rem;" id="nNum">—</span><span class="badge" id="nBadge">—</span></div>
        <h3 class="mt-8" id="nTitle">—</h3>
        <div class="tag-row mt-8" id="nTags"></div>
      </div>
      <div class="section-title">Операции <span class="count" id="opCount"></span></div>
      <div class="card" id="nOps"></div>
      <div class="section-title">Итоги смены</div>
      <div class="card" id="nTotals"></div>
      <button class="btn btn-primary mt-12" id="printBtn">🖨 Печать наряда</button>
      <button class="btn btn-secondary mt-8" id="closeBtn">Закрыть наряд</button>
    </section>

    <section class="screen" id="s3">
      <div class="result-hero"><div class="check">✓</div><h2 id="actTitle">Готово</h2><p id="actText">Наряд сохранён.</p></div>
      <div class="ticket mb-16"><div class="t-label">Наряд</div><div class="t-num" id="actNum">—</div></div>
      <button class="btn btn-primary mt-16" id="toList">К нарядам</button>
      <button class="btn btn-secondary mt-8" id="toHub">Вернуться в хаб</button>
    </section>

  </div>

  <footer class="app-footer">3DMP · Наряды · демо-режим</footer>
</div>

<script defer src="../../assets/js/utils.js?v=1"></script>
<script defer src="../../assets/js/router.js?v=1"></script>
<script defer src="b11.js?v=1"></script>
  <script defer src="../../assets/js/catalog.js?v=1"></script>
  <script defer src="../../assets/js/guide.js?v=1"></script>
  <script defer src="../../assets/js/store.js?v=1"></script>
  <script defer src="../../assets/js/auth.js?v=1"></script>
  <script defer src="../../assets/js/theme.js?v=1"></script>
</body>
</html>
