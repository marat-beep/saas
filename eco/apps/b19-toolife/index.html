<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B19 · Инструмент и стойкость — 3DMP</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<style>
  .t-row { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--border-2); cursor:pointer; }
  .t-row:last-child { border-bottom:none; }
  .life { height:6px; border-radius:3px; background:var(--border-2); overflow:hidden; margin-top:6px; }
  .life > i { display:block; height:100%; }
  .offsets { display:flex; gap:8px; }
  .offsets div { flex:1; text-align:center; background:var(--surface-2); border-radius:8px; padding:8px; font-size:.78rem; }
  .offsets b { display:block; font-family:var(--mono); }
</style>
</head>
<body class="app-body" data-audience="staff">

<div class="app-shell">
  <header class="app-header">
    <button class="back" id="backBtn" hidden>←</button>
    <div class="title-block"><h1 id="headerTitle">Инструмент и стойкость</h1><div class="subtitle" id="headerSubtitle">3DMP · Корректоры и износ</div></div>
    <div class="spacer"></div>
    <button class="header-action" id="homeBtn">Хаб</button>
  </header>

  <div class="content" id="content">

    <section class="screen active" id="s1">
      <div class="stats mb-16">
        <div class="stat"><div class="num accent" id="kT">—</div><div class="label">Инструментов</div></div>
        <div class="stat"><div class="num warning" id="kLow">—</div><div class="label">На пределе</div></div>
        <div class="stat"><div class="num danger" id="kCrit">—</div><div class="label">Критичный износ</div></div>
      </div>
      <div class="section-title">Магазин <span class="count" id="tCount"></span></div>
      <div class="card" id="tList"></div>
    </section>

    <section class="screen" id="s2">
      <div class="card accent-left mb-12">
        <div class="row between"><span class="faint" style="font-family:var(--mono);font-size:.72rem;" id="dId">—</span><span class="badge" id="dStatus">—</span></div>
        <h3 class="mt-8" id="dTitle">—</h3>
        <div class="tag-row mt-8" id="dTags"></div>
      </div>
      <div class="section-title">Корректоры</div>
      <div class="card"><div class="offsets" id="dOffsets"></div></div>
      <div class="section-title">Стойкость</div>
      <div class="card" id="dLife"></div>
      <div class="btn-row"><button class="btn btn-primary" id="replaceBtn">Заменить инструмент</button></div>
      <button class="btn btn-secondary mt-8" id="orderBtn">Заказать (B14)</button>
    </section>

    <section class="screen" id="s3">
      <div class="result-hero"><div class="check">✓</div><h2 id="actTitle">Готово</h2><p id="actText">Данные обновлены.</p></div>
      <div class="ticket mb-16"><div class="t-label">Инструмент</div><div class="t-num" id="actNum">—</div></div>
      <button class="btn btn-primary mt-16" id="toList">К магазину</button>
      <button class="btn btn-secondary mt-8" id="toHub">Вернуться в хаб</button>
    </section>

  </div>

  <footer class="app-footer">3DMP · Инструмент и стойкость · демо-режим</footer>
</div>

<script defer src="../../assets/js/utils.js"></script>
<script defer src="../../assets/js/router.js"></script>
<script defer src="b19.js"></script>
  <script defer src="../../assets/js/catalog.js?v=1"></script>
  <script defer src="../../assets/js/store.js?v=1"></script>
  <script defer src="../../assets/js/auth.js?v=1"></script>
  <script defer src="../../assets/js/theme.js?v=1"></script>
  <script defer src="../../assets/js/guide.js?v=1"></script>
</body>
</html>
