<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B29 · Рабочее место сервисного инженера — 3DMP</title>
<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<style>
  .svc-row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--border-2); cursor:pointer; }
  .svc-row:last-child { border-bottom:none; }
  .chk { display:flex; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--border-2); cursor:pointer; font-size:.82rem; }
  .chk:last-child { border-bottom:none; }
  .chk .box { width:20px;height:20px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.62rem;flex-shrink:0; }
  .chk.done .box { background:var(--accent); border-color:var(--accent); }
  .chk.done .lbl { text-decoration:line-through; color:var(--muted); }
</style>
</head>
<body class="app-body" data-audience="staff">

<div class="app-shell">
  <header class="app-header">
    <button class="back" id="backBtn" hidden>←</button>
    <div class="title-block"><h1 id="headerTitle">Сервисный инженер</h1><div class="subtitle" id="headerSubtitle">3DMP · Заявки и выезды</div></div>
    <div class="spacer"></div>
    <button class="header-action" id="homeBtn">Хаб</button>
  </header>

  <div class="content" id="content">

    <section class="screen active" id="s1">
      <div class="stats mb-16">
        <div class="stat"><div class="num danger" id="kNew">—</div><div class="label">Новые</div></div>
        <div class="stat"><div class="num warning" id="kWork">—</div><div class="label">В работе</div></div>
        <div class="stat"><div class="num success" id="kDone">—</div><div class="label">Закрыто</div></div>
      </div>
      <div class="chips" id="filters">
        <div class="chip active" data-f="open">Открытые</div>
        <div class="chip" data-f="emergency">Аварийные</div>
        <div class="chip" data-f="all">Все</div>
      </div>
      <div class="card" id="svcList"></div>
    </section>

    <section class="screen" id="s2">
      <div class="card accent-left mb-12">
        <div class="row between"><span class="faint" style="font-family:var(--mono);font-size:.72rem;" id="dId">—</span><span class="badge" id="dStatus">—</span></div>
        <h3 class="mt-8" id="dTitle">—</h3>
        <div class="tag-row mt-8" id="dTags"></div>
      </div>
      <div class="section-title">Данные выезда</div>
      <div class="card" id="dInfo"></div>
      <div class="section-title">Диагностика (чек-лист)</div>
      <div class="card" id="dChecks"></div>
      <div class="btn-row"><button class="btn btn-primary" id="startBtn">Принять и выехать</button></div>
      <button class="btn btn-secondary mt-8" id="closeBtn">Завершить выезд</button>
    </section>

    <section class="screen" id="s3">
      <div class="result-hero"><div class="check">✓</div><h2 id="actTitle">Готово</h2><p id="actText">Заявка обновлена.</p></div>
      <div class="ticket mb-16"><div class="t-label">Тикет</div><div class="t-num" id="actNum">—</div></div>
      <button class="btn btn-primary mt-16" id="toList">К заявкам</button>
      <button class="btn btn-secondary mt-8" id="toHub">Вернуться в хаб</button>
    </section>

  </div>

  <footer class="app-footer">3DMP · Рабочее место сервисного инженера · демо-режим</footer>
</div>

<script defer src="../../assets/js/utils.js"></script>
<script defer src="../../assets/js/router.js"></script>
<script defer src="b29.js"></script>
  <script defer src="../../assets/js/catalog.js?v=1"></script>
  <script defer src="../../assets/js/store.js?v=1"></script>
  <script defer src="../../assets/js/auth.js?v=1"></script>
  <script defer src="../../assets/js/theme.js?v=1"></script>
  <script defer src="../../assets/js/guide.js?v=1"></script>
</body>
</html>
