<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B15 · ТОиР и простои — 3DMP</title>
<link rel="stylesheet" href="../../assets/css/tokens.css?v=1">
<link rel="stylesheet" href="../../assets/css/components.css?v=1">
<style>
  .eq-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border-2); cursor:pointer; }
  .eq-row:last-child { border-bottom:none; }
  .reg { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--border-2); font-size:.8rem; }
  .reg:last-child { border-bottom:none; }
</style>
</head>
<body class="app-body" data-audience="staff">

<div class="app-shell">
  <header class="app-header">
    <button class="back" id="backBtn" hidden>←</button>
    <div class="title-block"><h1 id="headerTitle">ТОиР и простои</h1><div class="subtitle" id="headerSubtitle">3DMP · Обслуживание оборудования</div></div>
    <div class="spacer"></div>
    <button class="header-action" id="homeBtn">Хаб</button>
  </header>

  <div class="content" id="content">

    <section class="screen active" id="s1">
      <div class="stats mb-16">
        <div class="stat"><div class="num warning" id="kSoon">—</div><div class="label">ТО на неделе</div></div>
        <div class="stat"><div class="num danger" id="kOver">—</div><div class="label">Просрочено</div></div>
        <div class="stat"><div class="num info" id="kDown">—</div><div class="label">Простои, ч/мес</div></div>
      </div>
      <div class="section-title">Оборудование <span class="count" id="eqCount"></span></div>
      <div class="card" id="eqList"></div>
    </section>

    <section class="screen" id="s2">
      <div class="card accent-left mb-12">
        <div class="row between"><span class="faint" style="font-family:var(--mono);font-size:.72rem;" id="eqNum">—</span><span class="badge" id="eqBadge">—</span></div>
        <h3 class="mt-8" id="eqTitle">—</h3>
        <div class="tag-row mt-8" id="eqTags"></div>
      </div>
      <div class="section-title">Регламенты ТО</div>
      <div class="card" id="eqRegs"></div>
      <div class="section-title">История</div>
      <div class="card" id="eqHistory"></div>
      <div class="btn-row"><button class="btn btn-primary" id="toBtn">Отметить ТО</button></div>
      <button class="btn btn-secondary mt-8" id="downBtn">⚠️ Зарегистрировать простой</button>
    </section>

    <section class="screen" id="s3">
      <div class="result-hero"><div class="check">✓</div><h2 id="actTitle">Готово</h2><p id="actText">Запись сохранена.</p></div>
      <div class="ticket mb-16"><div class="t-label">Запись</div><div class="t-num" id="actNum">—</div></div>
      <button class="btn btn-primary mt-16" id="toList">Назад</button>
      <button class="btn btn-secondary mt-8" id="toHub">Вернуться в хаб</button>
    </section>

  </div>

  <footer class="app-footer">3DMP · ТОиР и простои · демо-режим</footer>
</div>

<script defer src="../../assets/js/utils.js?v=1"></script>
<script defer src="../../assets/js/router.js?v=1"></script>
<script defer src="b15.js?v=1"></script>
  <script defer src="../../assets/js/catalog.js?v=1"></script>
  <script defer src="../../assets/js/guide.js?v=1"></script>
  <script defer src="../../assets/js/store.js?v=1"></script>
  <script defer src="../../assets/js/auth.js?v=1"></script>
  <script defer src="../../assets/js/theme.js?v=1"></script>
</body>
</html>
